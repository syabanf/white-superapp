syntax = "proto3";

package white.seosuite.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "white/common/v1/common.proto";

option go_package = "github.com/syabanf/white-superapp/white-backend/gen/go/white/seosuite/v1;seosuitev1";

// SEO suite: keyword research, rank tracking, backlinks and competitor
// domains (the Semrush-style module). The SEO property itself lives in
// analytics; this service only references it by id.

enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DESKTOP = 1;
  MOBILE = 2;
}

enum KeywordIntent {
  KEYWORD_INTENT_UNSPECIFIED = 0;
  INFORMATIONAL = 1;
  NAVIGATIONAL = 2;
  COMMERCIAL = 3;
  TRANSACTIONAL = 4;
}

enum ResearchMode {
  RESEARCH_MODE_UNSPECIFIED = 0;
  IDEAS = 1;
  QUESTIONS = 2;
  RELATED = 3;
}

enum RankChangeKind {
  RANK_CHANGE_KIND_UNSPECIFIED = 0;
  UP = 1;
  DOWN = 2;
  FLAT = 3;
  NEW = 4;
  LOST = 5;
  NONE = 6;
}

// Which data source answered: "dataforseo", "apify" (mock + live SERP) or "mock".
message ProviderMode {
  string mode = 1;
}

// One research idea as the provider returns it. Money in IDR.
message KeywordIdea {
  string keyword = 1;
  int32 volume = 2;
  int32 difficulty = 3;
  double cpc = 4;
  double competition = 5;
  KeywordIntent intent = 6;
  // Last 12 months, oldest first.
  repeated int32 trend = 7;
  repeated string serp_features = 8;
}

message SyncJob {
  string id = 1;
  string client_id = 2;
  string kind = 3;
  white.common.v1.JobStatus status = 4;
  google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp finished_at = 6;
  optional string message = 7;
  optional string error = 8;
}

// ─────────────────────────────────────────────────────────────
// KeywordService: tracked keywords and rank tracking
// ─────────────────────────────────────────────────────────────

service KeywordService {
  // "Lacak" from the research table: ideas with known metrics. ADMIN/MANAGER.
  rpc TrackKeywords(TrackKeywordsRequest) returns (AddedResponse) {
    option (google.api.http) = {post: "/v1/clients/{client_id}/seo/keywords:track" body: "*"};
  }
  // Bulk textarea; metrics are enriched through the provider. ADMIN/MANAGER.
  rpc AddTrackedKeywords(AddTrackedKeywordsRequest) returns (AddedResponse) {
    option (google.api.http) = {post: "/v1/clients/{client_id}/seo/keywords" body: "*"};
  }
  rpc DeleteTrackedKeyword(DeleteTrackedKeywordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/clients/{client_id}/seo/keywords/{keyword_id}"};
  }
  rpc UpdateKeywordTags(UpdateKeywordTagsRequest) returns (UpdateKeywordTagsResponse) {
    option (google.api.http) = {patch: "/v1/clients/{client_id}/seo/keywords/{keyword_id}/tags" body: "*"};
  }
  // Re-checks every tracked keyword. VIEWER allowed; 10 minute cooldown per client.
  rpc RefreshRanks(PropertyRequest) returns (RefreshRanksResponse) {
    option (google.api.http) = {post: "/v1/clients/{client_id}/seo/ranks:refresh" body: "*"};
  }
  rpc GetRankData(GetRankDataRequest) returns (RankData) {
    option (google.api.http) = {get: "/v1/clients/{client_id}/seo/ranks"};
  }
  rpc GetTrackedKeywordSet(PropertyRequest) returns (TrackedKeywordSet) {
    option (google.api.http) = {get: "/v1/clients/{client_id}/seo/tracked-keywords"};
  }
  // Latest SEO_SUITE_* jobs, newest first. Used for cooldown hints.
  rpc ListSyncJobs(ListSyncJobsRequest) returns (ListSyncJobsResponse) {
    option (google.api.http) = {get: "/v1/clients/{client_id}/seo/sync-jobs"};
  }
}

message IdeaInput {
  string keyword = 1;
  optional int32 volume = 2;
  optional double difficulty = 3;
  optional double cpc = 4;
  KeywordIntent intent = 5;
}

message TrackKeywordsRequest {
  string client_id = 1;
  string property_id = 2;
  repeated IdeaInput ideas = 3;
  DeviceType device = 4;
  repeated string tags = 5;
}

message AddTrackedKeywordsRequest {
  string client_id = 1;
  string property_id = 2;
  // One keyword per line or comma separated, max 100 per call.
  string text = 3;
  DeviceType device = 4;
  // Comma separated, max 10 tags of 30 characters.
  string tags = 5;
}

message AddedResponse {
  int32 added = 1;
}

message DeleteTrackedKeywordRequest {
  string client_id = 1;
  string keyword_id = 2;
}

message UpdateKeywordTagsRequest {
  string client_id = 1;
  string keyword_id = 2;
  string tags = 3;
}

message UpdateKeywordTagsResponse {
  repeated string tags = 1;
}

message PropertyRequest {
  string client_id = 1;
  string property_id = 2;
}

message RefreshRanksResponse {
  int32 updated = 1;
}

message GetRankDataRequest {
  string client_id = 1;
  string property_id = 2;
  white.common.v1.RangeQuery range = 3;
}

message RankKpis {
  double visibility = 1;
  optional double avg_position = 2;
  int32 top3 = 3;
  int32 top10 = 4;
}

message RankKpiDeltas {
  white.common.v1.Delta visibility = 1;
  white.common.v1.Delta avg_position = 2;
  white.common.v1.Delta top3 = 3;
  white.common.v1.Delta top10 = 4;
}

message RankStrip {
  int32 tracked = 1;
  int32 ranked = 2;
  int32 unranked = 3;
  int32 improved = 4;
  int32 declined = 5;
}

message RankDailyPoint {
  string date = 1;
  optional double visibility = 2;
  optional double visibility_prev = 3;
  optional double avg_position = 4;
  optional double avg_position_prev = 5;
}

message RankBucketCount {
  // "1-3", "4-10", "11-20", "21-50", "51-100", "unranked"
  string bucket = 1;
  int32 count = 2;
}

message ShareOfVoiceRow {
  string domain = 1;
  double weight = 2;
  double share = 3;
}

message RankChange {
  RankChangeKind kind = 1;
  // prev - cur; positive means the keyword moved up.
  optional int32 delta = 2;
}

message RankKeywordRow {
  string id = 1;
  string keyword = 2;
  DeviceType device = 3;
  repeated string tags = 4;
  optional int32 volume = 5;
  optional int32 difficulty = 6;
  optional double cpc = 7;
  KeywordIntent intent = 8;
  optional int32 position = 9;
  optional string url = 10;
  repeated string serp_features = 11;
  optional int32 start_position = 12;
  optional int32 best = 13;
  RankChange change = 14;
  // 30-day sparkline, 101 - position (0 when unranked).
  repeated int32 spark = 15;
  google.protobuf.Timestamp created_at = 16;
}

message RankData {
  bool has_keywords = 1;
  optional string latest_date = 2;
  RankKpis kpis = 3;
  RankKpiDeltas deltas = 4;
  RankStrip strip = 5;
  repeated RankDailyPoint daily = 6;
  repeated RankBucketCount distribution = 7;
  repeated ShareOfVoiceRow sov = 8;
  repeated RankKeywordRow rows = 9;
  repeated string tags = 10;
  white.common.v1.ResolvedRange range = 11;
  ProviderMode provider = 12;
}

message TrackedKeywordSet {
  repeated string keywords = 1;
}

message ListSyncJobsRequest {
  string client_id = 1;
  // Defaults to every SEO_SUITE_* kind.
  repeated string kinds = 2;
  int32 limit = 3;
}

message ListSyncJobsResponse {
  repeated SyncJob jobs = 1;
}

// ─────────────────────────────────────────────────────────────
// ResearchService: keyword ideas (7-day cache) and keyword gap
// ─────────────────────────────────────────────────────────────

service ResearchService {
  rpc GetResearch(GetResearchRequest) returns (ResearchResult) {
    option (google.api.http) = {get: "/v1/clients/{client_id}/seo/research"};
  }
  // Live provider call against the suite property's own domain. Not cached.
  rpc GetKeywordGap(GetKeywordGapRequest) returns (KeywordGap) {
    option (google.api.http) = {get: "/v1/clients/{client_id}/seo/research/gap"};
  }
}

message GetResearchRequest {
  string client_id = 1;
  string seed = 2;
  ResearchMode mode = 3;
}

message ResearchResult {
  repeated KeywordIdea ideas = 1;
  google.protobuf.Timestamp fetched_at = 2;
  bool from_cache = 3;
  // "dataforseo", "apify" or "mock": the provider that produced the cached run.
  string provider = 4;
  ResearchMode mode = 5;
  string seed = 6;
}

message GetKeywordGapRequest {
  string client_id = 1;
  string competitor_domain = 2;
}

message GapRow {
  string keyword = 1;
  int32 volume = 2;
  optional int32 own_position = 3;
  optional int32 competitor_position = 4;
}

message KeywordGap {
  repeated GapRow missing = 1;
  repeated GapRow weak = 2;
  repeated GapRow strong = 3;
  repeated GapRow shared = 4;
  string own_domain = 5;
  string competitor_domain = 6;
}

// ─────────────────────────────────────────────────────────────
// BacklinkService
// ─────────────────────────────────────────────────────────────

service BacklinkService {
  // VIEWER allowed; 10 minute cooldown per client.
  rpc RefreshBacklinks(PropertyRequest) returns (RefreshBacklinksResponse) {
    option (google.api.http) = {post: "/v1/clients/{client_id}/seo/backlinks:refresh" body: "*"};
  }
  rpc GetBacklinkData(GetBacklinkDataRequest) returns (BacklinkData) {
    option (google.api.http) = {get: "/v1/clients/{client_id}/seo/backlinks"};
  }
}

message RefreshBacklinksResponse {
  int32 added = 1;
  int32 lost = 2;
}

message GetBacklinkDataRequest {
  string client_id = 1;
  string property_id = 2;
  white.common.v1.RangeQuery range = 3;
}

message BacklinkSnapshot {
  string date = 1;
  int32 backlinks = 2;
  int32 referring_domains = 3;
  int32 dofollow = 4;
  int32 nofollow = 5;
  int32 new_backlinks = 6;
  int32 lost_backlinks = 7;
  optional int32 domain_rank = 8;
  optional double toxic_share = 9;
}

message BacklinkDeltas {
  white.common.v1.Delta backlinks = 1;
  white.common.v1.Delta referring_domains = 2;
  white.common.v1.Delta domain_rank = 3;
  white.common.v1.Delta dofollow_share = 4;
}

message BacklinkDailyPoint {
  string date = 1;
  // Absent on days without a snapshot.
  optional int32 referring_domains = 2;
}

message BacklinkWeeklyPoint {
  // Monday of the week, YYYY-MM-DD.
  string date = 1;
  int32 new_backlinks = 2;
  int32 lost_backlinks = 3;
}

message Backlink {
  string id = 1;
  string source_url = 2;
  string source_domain = 3;
  string target_url = 4;
  string anchor = 5;
  bool dofollow = 6;
  optional int32 domain_rank = 7;
  optional int32 spam_score = 8;
  string first_seen = 9;
  string last_seen = 10;
  bool is_lost = 11;
  // Live link with spam score >= 60.
  bool is_toxic = 12;
  // Live link first seen within the last 30 days.
  bool is_new = 13;
}

message LabelCount {
  string label = 1;
  int32 count = 2;
}

message BacklinkData {
  optional BacklinkSnapshot latest = 1;
  // Present when a snapshot at least 30 days older than `latest` exists.
  optional BacklinkDeltas deltas = 2;
  double dofollow_share = 3;
  repeated BacklinkDailyPoint daily = 4;
  repeated BacklinkWeeklyPoint weekly = 5;
  repeated Backlink rows = 6;
  repeated LabelCount top_anchors = 7;
  repeated LabelCount top_domains = 8;
  string today = 9;
  white.common.v1.ResolvedRange range = 10;
  ProviderMode provider = 11;
}

// ─────────────────────────────────────────────────────────────
// CompetitorService: competitor domains and domain benchmark
// ─────────────────────────────────────────────────────────────

service CompetitorService {
  // ADMIN/MANAGER. Max 5 domains per property.
  rpc AddCompetitorDomain(AddCompetitorDomainRequest) returns (CompetitorDomain) {
    option (google.api.http) = {post: "/v1/clients/{client_id}/seo/competitors" body: "*"};
  }
  rpc RemoveCompetitorDomain(RemoveCompetitorDomainRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/clients/{client_id}/seo/competitors/{id}"};
  }
  // VIEWER allowed; 10 minute cooldown per client.
  rpc RefreshDomains(PropertyRequest) returns (RefreshDomainsResponse) {
    option (google.api.http) = {post: "/v1/clients/{client_id}/seo/competitors:refresh" body: "*"};
  }
  rpc GetCompetitorData(GetCompetitorDataRequest) returns (CompetitorData) {
    option (google.api.http) = {get: "/v1/clients/{client_id}/seo/competitors"};
  }
}

message AddCompetitorDomainRequest {
  string client_id = 1;
  string property_id = 2;
  string domain = 3;
}

message CompetitorDomain {
  string id = 1;
  string domain = 2;
  google.protobuf.Timestamp created_at = 3;
}

message RemoveCompetitorDomainRequest {
  string client_id = 1;
  string id = 2;
}

message RefreshDomainsResponse {
  int32 domains = 1;
}

message GetCompetitorDataRequest {
  string client_id = 1;
  string property_id = 2;
  white.common.v1.RangeQuery range = 3;
}

message BenchmarkRow {
  string domain = 1;
  bool is_own = 2;
  optional string date = 3;
  optional int32 organic_keywords = 4;
  optional int32 organic_traffic = 5;
  optional int32 top3 = 6;
  optional int32 top10 = 7;
  optional int32 backlinks = 8;
  optional int32 referring_domains = 9;
  optional int32 domain_rank = 10;
}

message TrafficSeries {
  // d0 (own domain), d1..d3 (top competitors by latest organic traffic).
  string key = 1;
  string label = 2;
}

message TrafficPoint {
  string date = 1;
  // Series key -> organic traffic. A missing key means no snapshot that day.
  map<string, int32> traffic = 2;
}

message CompetitorSuggestion {
  string domain = 1;
  int32 intersections = 2;
  int32 organic_traffic = 3;
}

message CompetitorData {
  string own_domain = 1;
  repeated CompetitorDomain competitors = 2;
  repeated BenchmarkRow benchmark = 3;
  repeated TrafficSeries series = 4;
  repeated TrafficPoint traffic = 5;
  repeated CompetitorSuggestion suggestions = 6;
  white.common.v1.ResolvedRange range = 7;
  ProviderMode provider = 8;
}

// ─────────────────────────────────────────────────────────────
// ReportDataService: internal numbers for the reports service
// ─────────────────────────────────────────────────────────────

service ReportDataService {
  // Raw inputs of buildRankSection. Formatting is the caller's job.
  rpc GetRankSection(GetRankSectionRequest) returns (RankSection);
  // Raw inputs of buildBacklinkSection.
  rpc GetBacklinkSection(GetBacklinkSectionRequest) returns (BacklinkSection);
}

message GetRankSectionRequest {
  string property_id = 1;
  white.common.v1.DateRange current = 2;
  white.common.v1.DateRange previous = 3;
}

message RankSectionRow {
  string keyword = 1;
  optional int32 position = 2;
  RankChange change = 3;
  optional int32 volume = 4;
}

message RankSection {
  bool has_keywords = 1;
  optional string latest_date = 2;
  RankKpis kpis = 3;
  RankKpiDeltas deltas = 4;
  // Top 10 by position (unranked last), then volume desc, then keyword.
  repeated RankSectionRow rows = 5;
}

message GetBacklinkSectionRequest {
  string property_id = 1;
  white.common.v1.DateRange range = 2;
}

message BacklinkSection {
  bool has_snapshot = 1;
  optional string latest_date = 2;
  int32 backlinks = 3;
  int32 referring_domains = 4;
  optional int32 domain_rank = 5;
  double dofollow_share = 6;
  // Sums of the weekly new/lost figures inside the range.
  int32 new_backlinks = 7;
  int32 lost_backlinks = 8;
}
