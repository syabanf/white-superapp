// Vendors, purchase requests, purchase orders and letterhead documents.
service DocumentService {
  rpc ListVendors(ListVendorsRequest) returns (ListVendorsResponse) {
    option (google.api.http) = {get: "/v1/finance/vendors"};
  }
  rpc SaveVendor(VendorInput) returns (Vendor) {
    option (google.api.http) = {post: "/v1/finance/vendors" body: "*"};
  }
  // Refused once a document uses the vendor; deactivate it instead.
  rpc DeleteVendor(IdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/vendors/{id}"};
  }
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {get: "/v1/finance/documents"};
  }
  rpc GetDocument(IdRequest) returns (FinanceDocument) {
    option (google.api.http) = {get: "/v1/finance/documents/{id}"};
  }
  rpc CreateDocument(DocumentInput) returns (FinanceDocument) {
    option (google.api.http) = {post: "/v1/finance/documents" body: "*"};
  }
  // Draft only.
  rpc UpdateDocument(DocumentInput) returns (FinanceDocument) {
    option (google.api.http) = {patch: "/v1/finance/documents/{id}" body: "*"};
  }
  // Draft only. A converted source becomes convertible again.
  rpc DeleteDocument(IdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/documents/{id}"};
  }
  // submit, send, accept, decline, reopen: finance.write.
  // approve, reject: finance.approve, and only Admin may decide their own.
  rpc ActOnDocument(ActOnDocumentRequest) returns (FinanceDocument) {
    option (google.api.http) = {post: "/v1/finance/documents/{id}:act" body: "*"};
  }
  // Approved PR to PO, accepted quotation to invoice. The new document is a draft.
  rpc ConvertDocument(ConvertDocumentRequest) returns (FinanceDocument) {
    option (google.api.http) = {post: "/v1/finance/documents/{id}:convert" body: "*"};
  }
  // Approved PO or draft invoice to a draft payable or receivable, once.
  rpc IssueDocument(IssueDocumentRequest) returns (FinanceDocument) {
    option (google.api.http) = {post: "/v1/finance/documents/{id}:issue" body: "*"};
  }
  // Internal: PDF bytes for the gateway.
  rpc RenderDocumentPdf(IdRequest) returns (DocumentPdf);
}

