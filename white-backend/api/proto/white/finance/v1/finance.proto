message AsOfRequest {
  // Defaults to today.
  string as_of = 1;
}

message PeriodRequest {
  // Defaults to the first day of the current month and today.
  string date_from = 1;
  string date_to = 2;
}

message AccountBalance {
  string id = 1;
  string code = 2;
  string code_display = 3;
  string name = 4;
  string account_type_code = 5;
  EntrySide normal_balance = 6;
  bool is_contra = 7;
  bool is_cash_bank = 8;
  string cash_flow_category = 9;
  int32 level = 10;
  string debit = 11;
  string credit = 12;
  string balance = 13;
}

message TrialBalance {
  string as_of = 1;
  repeated AccountBalance rows = 2;
  string total_debit = 3;
  string total_credit = 4;
}

message BalanceSheet {
  string as_of = 1;
  repeated AccountBalance assets = 2;
  repeated AccountBalance liabilities = 3;
  repeated AccountBalance equity = 4;
  string current_year_earnings = 5;
  string total_assets = 6;
  string total_liabilities = 7;
  string total_equity = 8;
  string total_liabilities_and_equity = 9;
}

message IncomeStatement {
  string date_from = 1;
  string date_to = 2;
  repeated AccountBalance revenue = 3;
  repeated AccountBalance cogs = 4;
  repeated AccountBalance expenses = 5;
  repeated AccountBalance other_income = 6;
  repeated AccountBalance other_expenses = 7;
  string total_revenue = 8;
  string total_cogs = 9;
  string gross_profit = 10;
  string total_expenses = 11;
  string operating_income = 12;
  string total_other_income = 13;
  string total_other_expenses = 14;
  string net_income = 15;
}

message CashFlowSection {
  string category = 1;
  repeated AccountBalance rows = 2;
  string total = 3;
}

message CashFlow {
  string date_from = 1;
  string date_to = 2;
  CashFlowSection operating = 3;
  CashFlowSection investing = 4;
  CashFlowSection financing = 5;
  CashFlowSection non_cash = 6;
  string net_cash_change = 7;
  string cash_opening = 8;
  string cash_closing = 9;
}

message GeneralLedgerAccount {
  string id = 1;
  string code = 2;
  string code_display = 3;
  string name = 4;
  string account_type_code = 5;
  string balance = 6;
}

message ListGeneralLedgerAccountsResponse {
  repeated GeneralLedgerAccount accounts = 1;
}

message ListSubsidiaryPartiesRequest {
  LedgerKind kind = 1;
}

message SubsidiaryParty {
  string party_name = 1;
  string outstanding = 2;
  int32 invoice_count = 3;
}

message ListSubsidiaryPartiesResponse {
  repeated SubsidiaryParty parties = 1;
}

message SubsidiaryLedgerRequest {
  LedgerKind kind = 1;
  string party_name = 2;
  string date_from = 3;
  string date_to = 4;
}

message SubsidiaryLine {
  string line_id = 1;
  string entry_date = 2;
  // invoice, payment or receipt.
  string doc_type = 3;
  string doc_no = 4;
  string description = 5;
  string debit = 6;
  string credit = 7;
  string source_id = 8;
  string running_balance = 9;
}

message SubsidiaryLedger {
  LedgerKind kind = 1;
  string party_name = 2;
  string date_from = 3;
  string date_to = 4;
  string opening_balance = 5;
  string total_debit = 6;
  string total_credit = 7;
  string closing_balance = 8;
  repeated SubsidiaryLine lines = 9;
}

message DashboardRequest {
  string as_of = 1;
  string date_from = 2;
  string date_to = 3;
}

message NameValue {
  string name = 1;
  string value = 2;
}

message MonthTrend {
  string month = 1;
  string revenue = 2;
  string expense = 3;
  string net = 4;
}

message DashboardKpis {
  string total_assets = 1;
  string total_liabilities = 2;
  string total_equity = 3;
  string net_income = 4;
  string cash_balance = 5;
  string cash_opening = 6;
  string cash_change = 7;
  string trial_balance_diff = 8;
  int32 posted_entries = 9;
  int32 draft_entries = 10;
  string receivable_outstanding = 11;
  string payable_outstanding = 12;
  int32 pending_reimbursements = 13;
  // P&L since the covering fiscal year's start; already part of total_equity,
  // as on the balance sheet.
  string current_year_earnings = 14;
}

message Dashboard {
  string as_of = 1;
  string date_from = 2;
  string date_to = 3;
  DashboardKpis kpis = 4;
  repeated NameValue balance_composition = 5;
  repeated NameValue pnl_breakdown = 6;
  repeated NameValue cash_flow_breakdown = 7;
  repeated MonthTrend monthly_trend = 8;
  repeated NameValue top_expense_accounts = 9;
}

// ─── Dashboard analytics ───────────────────────────────────

message FinanceAnalyticsRequest {
  // Defaults to the first of the current month through today.
  string from = 1;
  string to = 2;
  // "previous" (same length ending the day before from, the default) or
  // "year" (the same dates a year earlier).
  string compare = 3;
  // Account breakdowns only: one account type code (REVENUE, COGS, ...).
  string account_type = 4;
  // Account breakdowns only: descendants of one header account.
  string account_group = 5;
  // Reimbursement widgets only: one department name.
  string department = 6;
  // Cash balances only: one cash or bank account.
  string cash_account_id = 7;
}

message AnalyticsWindow {
  string from = 1;
  string to = 2;
  string compare = 3;
  string compare_from = 4;
  string compare_to = 5;
  // Trend months (YYYY-MM): the range's months when it spans three or
  // more, else the twelve months ending at to. compare_months align with
  // them (a year earlier, or the window before).
  repeated string months = 6;
  repeated string compare_months = 7;
}

// One KPI over the range and the comparison range, with its monthly trend.
// Money is a decimal string; ratios are percentages or days as decimals.
message AnalyticsKpi {
  string key = 1;
  string value = 2;
  string previous = 3;
  repeated string trend = 4;
}

// Monthly values aligned with AnalyticsWindow.months.
message AnalyticsSeries {
  string key = 1;
  string label = 2;
  repeated string values = 3;
  repeated string compare_values = 4;
  string total = 5;
  // Account code, or empty.
  string code = 6;
}

// A ranked slice: an account, a group, a client, a category...
message AnalyticsAmount {
  // Account id, client name, category code...
  string key = 1;
  string label = 2;
  string code = 3;
  string group = 4;
  string value = 5;
  string previous = 6;
  int32 count = 7;
}

message WaterfallStep {
  string key = 1;
  string label = 2;
  // Signed amount; for a total step, the running total itself.
  string value = 3;
  bool total = 4;
}

message FinanceSummary {
  AnalyticsWindow window = 1;
  // revenue, expense, net_income, net_margin, cash, receivable, payable,
  // pending_reimbursement.
  repeated AnalyticsKpi kpis = 2;
  // revenue, expense, net_income per month with comparison values.
  repeated AnalyticsSeries pnl = 3;
  // Month-end cash (key "cash") with comparison values.
  repeated AnalyticsSeries cash = 4;
  // Balance sheet at to, by header group.
  repeated AnalyticsAmount assets = 5;
  repeated AnalyticsAmount liabilities = 6;
  repeated AnalyticsAmount equity = 7;
  string trial_balance_diff = 8;
  int32 posted_entries = 9;
  int32 draft_entries = 10;
}

message FinanceProfitability {
  AnalyticsWindow window = 1;
  // revenue, gross_profit, gross_margin, operating_margin, net_margin,
  // opex_ratio.
  repeated AnalyticsKpi kpis = 2;
  // Revenue down to net income over the range.
  repeated WaterfallStep waterfall = 3;
  // revenue, cogs, expense, other_income, other_expense, gross_profit,
  // operating_income, net_income.
  repeated AnalyticsSeries pnl = 4;
  repeated AnalyticsAmount revenue_accounts = 5;
  // Posted AR invoice subtotals by client in the range.
  repeated AnalyticsAmount revenue_clients = 6;
  repeated AnalyticsAmount expense_groups = 7;
  repeated AnalyticsAmount expense_accounts = 8;
  // Profit and loss accounts (after the account filters) per month.
  repeated AnalyticsSeries account_months = 9;
}

message CashAccountSummary {
  string account_id = 1;
  string code = 2;
  string name = 3;
  string opening = 4;
  string inflow = 5;
  string outflow = 6;
  string closing = 7;
}

message FinanceCashAnalytics {
  AnalyticsWindow window = 1;
  // cash, net_change, operating, investing, financing, burn_rate, runway.
  repeated AnalyticsKpi kpis = 2;
  // operating, investing, financing, non_cash, net per month.
  repeated AnalyticsSeries flows = 3;
  // Month-end balance per cash or bank account.
  repeated AnalyticsSeries balances = 4;
  // Opening cash, the three activities, other, closing cash.
  repeated WaterfallStep bridge = 5;
  repeated CashAccountSummary accounts = 6;
}

message AgingRow {
  // AR or AP.
  string kind = 1;
  // current, 1_30, 31_60, 61_90, 90_plus.
  string bucket = 2;
  string amount = 3;
  int32 count = 4;
}

message PartyBalance {
  string party_name = 1;
  string outstanding = 2;
  string overdue = 3;
  int32 invoice_count = 4;
  int32 oldest_days = 5;
  // Invoiced in the range.
  string billed = 6;
}

message OverdueInvoice {
  string id = 1;
  string kind = 2;
  string invoice_no = 3;
  string party_name = 4;
  string invoice_date = 5;
  string due_date = 6;
  string total = 7;
  string outstanding = 8;
  int32 days_overdue = 9;
}

message FinanceArAp {
  AnalyticsWindow window = 1;
  // receivable, payable, overdue_receivable, overdue_payable, dso, dpo.
  repeated AnalyticsKpi kpis = 2;
  // Open invoices at to by bucket.
  repeated AgingRow aging = 3;
  // Month-end outstanding per bucket (key = bucket).
  repeated AnalyticsSeries ar_aging_trend = 4;
  repeated AnalyticsSeries ap_aging_trend = 5;
  // dso and dpo per month.
  repeated AnalyticsSeries days = 6;
  repeated PartyBalance customers = 7;
  repeated PartyBalance vendors = 8;
  repeated OverdueInvoice overdue = 9;
}

message ClaimSummary {
  string id = 1;
  string claim_no = 2;
  string employee_name = 3;
  string department_name = 4;
  string category = 5;
  string transaction_date = 6;
  string amount = 7;
  string status = 8;
  // Days since submission.
  int32 age_days = 9;
}

message FinanceSpend {
  AnalyticsWindow window = 1;
  // expense, reimburse_paid, reimburse_pending, claims, approval_days,
  // rejection_rate.
  repeated AnalyticsKpi kpis = 2;
  // Expense per header group per month (after the account filters).
  repeated AnalyticsSeries expense_groups = 3;
  // Claimed amount per category per month (by transaction date).
  repeated AnalyticsSeries claim_categories = 4;
  repeated AnalyticsAmount by_category = 5;
  repeated AnalyticsAmount by_department = 6;
  repeated AnalyticsAmount by_status = 7;
  // Average days per approval stage: value is a decimal, count the claims.
  repeated AnalyticsAmount lead_time = 8;
  // Average days from submission to payment, per month paid.
  repeated AnalyticsSeries lead_time_trend = 9;
  // Claims waiting for a manager, finance or payment, oldest first.
  repeated ClaimSummary pending = 10;
  repeated string departments = 11;
}

// ─────────────────────────────────────────────────────────────
// ReimbursementService
// ─────────────────────────────────────────────────────────────

service ReimbursementService {
  // Self-service (self.service).
  rpc ListMyClaims(ListMyClaimsRequest) returns (ListClaimsResponse) {
    option (google.api.http) = {get: "/v1/finance/my/reimbursements"};
  }
  rpc CreateClaim(ClaimInput) returns (Claim) {
    option (google.api.http) = {
      post: "/v1/finance/reimbursements"
      body: "*"
    };
  }
  rpc UpdateClaim(UpdateClaimRequest) returns (Claim) {
    option (google.api.http) = {
      patch: "/v1/finance/reimbursements/{id}"
      body: "input"
    };
  }
  rpc UploadReceipt(UploadReceiptRequest) returns (Claim) {
    option (google.api.http) = {
      post: "/v1/finance/reimbursements/{id}/receipts"
      body: "*"
    };
  }
  rpc DeleteReceipt(DeleteReceiptRequest) returns (Claim) {
    option (google.api.http) = {delete: "/v1/finance/reimbursements/{id}/receipts/{receipt_id}"};
  }
  rpc SubmitClaim(IdRequest) returns (Claim) {
    option (google.api.http) = {post: "/v1/finance/reimbursements/{id}:submit"};
  }
  rpc CancelClaim(IdRequest) returns (Claim) {
    option (google.api.http) = {post: "/v1/finance/reimbursements/{id}:cancel"};
  }
  // Owner, approvers and finance.read.
  rpc GetClaim(IdRequest) returns (Claim) {
    option (google.api.http) = {get: "/v1/finance/reimbursements/{id}"};
  }

  // Approvers: managers see their reports' SUBMITTED claims, finance
  // (finance.approve) sees APPROVED_MANAGER claims.
  rpc ListApprovalInbox(google.protobuf.Empty) returns (ListClaimsResponse) {
    option (google.api.http) = {get: "/v1/finance/reimbursement-inbox"};
  }
  rpc ApproveClaim(ApproveClaimRequest) returns (Claim) {
    option (google.api.http) = {
      post: "/v1/finance/reimbursements/{id}:approve"
      body: "*"
    };
  }
  rpc RejectClaim(RejectClaimRequest) returns (Claim) {
    option (google.api.http) = {
      post: "/v1/finance/reimbursements/{id}:reject"
      body: "*"
    };
  }

  // Finance.
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse) {
    option (google.api.http) = {get: "/v1/finance/reimbursements"};
  }
  rpc PayClaims(PayClaimsRequest) returns (ReimbursementBatch) {
    option (google.api.http) = {
      post: "/v1/finance/reimbursements:pay"
      body: "*"
    };
  }
  rpc ListPaymentBatches(ListPaymentBatchesRequest) returns (ListPaymentBatchesResponse) {
    option (google.api.http) = {get: "/v1/finance/reimbursement-batches"};
  }
  rpc GetMonthlySummary(MonthlySummaryRequest) returns (MonthlySummary) {
    option (google.api.http) = {get: "/v1/finance/reimbursements:summary"};
  }
  rpc ListPolicies(google.protobuf.Empty) returns (ListPoliciesResponse) {
    option (google.api.http) = {get: "/v1/finance/reimbursement-policies"};
  }
  rpc UpdatePolicy(PolicyInput) returns (ReimbursementPolicy) {
    option (google.api.http) = {
      put: "/v1/finance/reimbursement-policies/{category}"
      body: "*"
    };
  }

  // Internal: receipt bytes for the gateway (same access rules as GetClaim;
  // the gateway forwards the caller's token).
  rpc GetReceiptFile(GetReceiptFileRequest) returns (ReceiptFile);
}

enum ClaimCategory {
  CLAIM_CATEGORY_UNSPECIFIED = 0;
  TRANSPORT = 1;
  MAKAN = 2;
  AKOMODASI = 3;
  OPERASIONAL_PROYEK = 4;
  LAINNYA = 5;
}

enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  CLAIM_DRAFT = 1;
  SUBMITTED = 2;
  APPROVED_MANAGER = 3;
  APPROVED_FINANCE = 4;
  PAID = 5;
  REJECTED = 6;
  CANCELLED = 7;
}

message ClaimReceipt {
  string id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ClaimHistory {
  string action = 1;
  string actor_id = 2;
  string actor_name = 3;
  string note = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Claim {
  string id = 1;
  string claim_no = 2;
  string employee_id = 3;
  string employee_user_id = 4;
  string employee_name = 5;
  string department_name = 6;
  string manager_employee_id = 7;
  ClaimCategory category = 8;
  string transaction_date = 9;
  string amount = 10;
  string description = 11;
  string client_id = 12;
  string project = 13;
  ClaimStatus status = 14;
  // Above the per-claim or monthly policy limit: finance.approve required.
  bool over_limit = 15;
  string limit_note = 16;
  string reject_reason = 17;
  string rejected_stage = 18;
  repeated ClaimReceipt receipts = 19;
  repeated ClaimHistory history = 20;
  optional google.protobuf.Timestamp submitted_at = 21;
  optional google.protobuf.Timestamp paid_at = 22;
  string payment_batch_id = 23;
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp updated_at = 25;
  // What the caller may do now.
  bool can_edit = 26;
  bool can_approve = 27;
}

message ClaimInput {
  ClaimCategory category = 1;
  string transaction_date = 2;
  string amount = 3;
  string description = 4;
  string client_id = 5;
  string project = 6;
}

message UpdateClaimRequest {
  string id = 1;
  ClaimInput input = 2;
}

message UploadReceiptRequest {
  string id = 1;
  string filename = 2;
  bytes data = 3;
}

message DeleteReceiptRequest {
  string id = 1;
  string receipt_id = 2;
}

message ApproveClaimRequest {
  string id = 1;
  string note = 2;
}

message RejectClaimRequest {
  string id = 1;
  string reason = 2;
}

message ListMyClaimsRequest {
  ClaimStatus status = 1;
}

message ListClaimsRequest {
  ClaimStatus status = 1;
  ClaimCategory category = 2;
  string employee_id = 3;
  // YYYY-MM of the transaction date.
  string month = 4;
  string search = 5;
  int32 page_size = 6;
  int32 page = 7;
}

message ListClaimsResponse {
  repeated Claim claims = 1;
  int32 total = 2;
  string total_amount = 3;
}

message PayClaimsRequest {
  repeated string claim_ids = 1;
  // Empty uses the REIMBURSEMENT_PAYMENT mapping's cash account.
  string cash_account_id = 2;
  string paid_at = 3;
  string notes = 4;
}

message ReimbursementBatch {
  string id = 1;
  string batch_no = 2;
  string paid_at = 3;
  string cash_account_id = 4;
  string cash_account_name = 5;
  string total_amount = 6;
  int32 claim_count = 7;
  string journal_entry_id = 8;
  // posted, draft or skipped, with the reason when not posted.
  string journal_status = 9;
  string journal_reason = 10;
  string notes = 11;
  google.protobuf.Timestamp created_at = 12;
}

message ListPaymentBatchesRequest {
  int32 limit = 1;
}

message ListPaymentBatchesResponse {
  repeated ReimbursementBatch batches = 1;
}

message MonthlySummaryRequest {
  // YYYY-MM; defaults to the current month.
  string month = 1;
  // Self-service callers only see their own rows.
  bool mine = 2;
}

message MonthlySummaryRow {
  string employee_id = 1;
  string employee_name = 2;
  string department_name = 3;
  ClaimCategory category = 4;
  int32 claim_count = 5;
  string submitted_amount = 6;
  string approved_amount = 7;
  string paid_amount = 8;
}

message MonthlySummary {
  string month = 1;
  repeated MonthlySummaryRow rows = 2;
  string total_submitted = 3;
  string total_approved = 4;
  string total_paid = 5;
}

message ReimbursementPolicy {
  ClaimCategory category = 1;
  string label = 2;
  // Empty means no limit.
  string monthly_limit = 3;
  string per_claim_limit = 4;
  string expense_account_id = 5;
  string expense_account_name = 6;
  bool is_active = 7;
  // Claims within the limits skip the finance step.
  bool auto_approve = 8;
}

message PolicyInput {
  ClaimCategory category = 1;
  string monthly_limit = 2;
  string per_claim_limit = 3;
  string expense_account_id = 4;
  bool is_active = 5;
  bool auto_approve = 6;
}

message ListPoliciesResponse {
  repeated ReimbursementPolicy policies = 1;
}

message GetReceiptFileRequest {
  string receipt_id = 1;
}

message ReceiptFile {
  bytes data = 1;
  string content_type = 2;
  string filename = 3;
  string etag = 4;
}

// ─────────────────────────────────────────────────────────────
// AnalysisService: ratios from the ledger and the AI CFO memo
// ─────────────────────────────────────────────────────────────

service AnalysisService {
  rpc GetFinancialAnalysis(FinancialAnalysisRequest) returns (FinancialAnalysis) {
    option (google.api.http) = {get: "/v1/finance/analysis"};
  }
  rpc GenerateFinancialInsight(GenerateFinancialInsightRequest) returns (FinancialInsight) {
    option (google.api.http) = {
      post: "/v1/finance/analysis/insights"
      body: "*"
    };
  }
  rpc ListFinancialInsights(ListFinancialInsightsRequest) returns (ListFinancialInsightsResponse) {
    option (google.api.http) = {get: "/v1/finance/analysis/insights"};
  }
  // Monthly ratios with a benchmark per ratio.
  rpc GetRatioTrend(RatioTrendRequest) returns (RatioTrend) {
    option (google.api.http) = {get: "/v1/finance/analysis/trend"};
  }
}

message FinancialAnalysisRequest {
  string from = 1;
  string to = 2;
  // Compare with the previous period of the same length.
  bool compare = 3;
  // With compare: "previous" (default) or "year" (same dates a year earlier).
  string compare_mode = 4;
}

// A ratio or amount with its previous-period delta. Ratios are plain
// numbers (2.35 = 2.35x); margins are percentages (12.5 = 12.5%).
message Metric {
  string key = 1;
  string label = 2;
  double value = 3;
  // Not computable (zero denominator).
  bool unavailable = 4;
  optional white.common.v1.Delta delta = 5;
  bool lower_is_better = 6;
  // pct, ratio, days, months or idr.
  string unit = 7;
}

message ExpenseItem {
  string account_id = 1;
  string account_code = 2;
  string account_name = 3;
  string amount = 4;
  string previous_amount = 5;
  double share_pct = 6;
  optional white.common.v1.Delta delta = 7;
}

message FinancialAnalysis {
  white.common.v1.DateRange current = 1;
  optional white.common.v1.DateRange previous = 2;
  repeated Metric profitability = 3;
  repeated Metric liquidity = 4;
  repeated Metric leverage = 5;
  repeated Metric efficiency = 6;
  repeated Metric cash = 7;
  repeated ExpenseItem expense_breakdown = 8;
  // Largest absolute changes vs the previous period.
  repeated ExpenseItem top_movers = 9;
  string revenue = 10;
  string net_income = 11;
  string cash_balance = 12;
}

message GenerateFinancialInsightRequest {
  string from = 1;
  string to = 2;
  // "id" (default) or "en".
  string language = 3;
}

message FinancialInsight {
  string id = 1;
  string date_from = 2;
  string date_to = 3;
  string language = 4;
  string model = 5;
  string content = 6;
  google.protobuf.Timestamp created_at = 7;
  string created_by = 8;
}

message ListFinancialInsightsRequest {
  int32 limit = 1;
}

message ListFinancialInsightsResponse {
  repeated FinancialInsight insights = 1;
}

message RatioTrendRequest {
  // Last month of the trend; defaults to today.
  string to = 1;
  // Number of months, default 12, at most 24.
  int32 months = 2;
}

message RatioPoint {
  string month = 1;
  double value = 2;
  bool unavailable = 3;
}

message RatioTrendSeries {
  string key = 1;
  string label = 2;
  // profitability, liquidity, leverage, efficiency or cash.
  string group = 3;
  string unit = 4;
  bool lower_is_better = 5;
  repeated RatioPoint points = 6;
  // Healthy threshold for an agency.
  optional double benchmark = 7;
}

message RatioTrend {
  repeated string months = 1;
  repeated RatioTrendSeries series = 2;
}
