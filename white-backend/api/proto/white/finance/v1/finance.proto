syntax = "proto3";

package white.finance.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "white/common/v1/common.proto";

option go_package = "github.com/syabanf/white-superapp/white-backend/gen/go/white/finance/v1;financev1";

// Finance service: chart of accounts, fiscal calendar, journals, cash and
// bank, payables, receivables, reports, reimbursement claims and financial
// analysis. Ported from the NüHabit accounting module.
//
// Conventions:
// - Money is a decimal string with two places ("1250000.00"); inputs also
//   accept "1250000" or "1250000.5".
// - Days are "YYYY-MM-DD" (Asia/Jakarta calendar).
// - Permissions: read finance.read, drafts and cash-bank finance.write,
//   post/close/void/pay/approve finance.approve, reimbursement self-service
//   self.service.

// ─────────────────────────────────────────────────────────────
// Shared enums
// ─────────────────────────────────────────────────────────────

enum EntrySide {
  ENTRY_SIDE_UNSPECIFIED = 0;
  DEBIT = 1;
  CREDIT = 2;
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  POSTED = 2;
  VOID = 3;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  MANUAL = 1;
  OPENING = 2;
  AUTO = 3;
}

enum PeriodStatus {
  PERIOD_STATUS_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSED = 2;
}

// Accounts payable (vendor bills) or receivable (client invoices).
enum LedgerKind {
  LEDGER_KIND_UNSPECIFIED = 0;
  AP = 1;
  AR = 2;
}

// ─────────────────────────────────────────────────────────────
// AccountService: account types, chart of accounts, journal mappings
// ─────────────────────────────────────────────────────────────

service AccountService {
  rpc ListAccountTypes(ListAccountTypesRequest) returns (ListAccountTypesResponse) {
    option (google.api.http) = {get: "/v1/finance/account-types"};
  }
  rpc CreateAccountType(AccountTypeInput) returns (AccountType) {
    option (google.api.http) = {
      post: "/v1/finance/account-types"
      body: "*"
    };
  }
  rpc UpdateAccountType(UpdateAccountTypeRequest) returns (AccountType) {
    option (google.api.http) = {
      patch: "/v1/finance/account-types/{id}"
      body: "input"
    };
  }
  rpc DeleteAccountType(IdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/account-types/{id}"};
  }

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1/finance/accounts"};
  }
  rpc GetAccount(IdRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/finance/accounts/{id}"};
  }
  rpc CreateAccount(AccountInput) returns (Account) {
    option (google.api.http) = {
      post: "/v1/finance/accounts"
      body: "*"
    };
  }
  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = {
      patch: "/v1/finance/accounts/{id}"
      body: "input"
    };
  }
  rpc DeleteAccount(IdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/accounts/{id}"};
  }
  // XLSX import (sheet "coa" or the first one). mode "preview" or "commit".
  rpc ImportAccounts(ImportAccountsRequest) returns (ImportAccountsResponse) {
    option (google.api.http) = {
      post: "/v1/finance/accounts:import"
      body: "*"
    };
  }
  // Postable, active accounts for pickers.
  rpc ListPostableAccounts(google.protobuf.Empty) returns (ListPostableAccountsResponse) {
    option (google.api.http) = {get: "/v1/finance/accounts:postable"};
  }

  rpc ListJournalEvents(google.protobuf.Empty) returns (ListJournalEventsResponse) {
    option (google.api.http) = {get: "/v1/finance/journal-events"};
  }
  rpc ListJournalMappings(ListJournalMappingsRequest) returns (ListJournalMappingsResponse) {
    option (google.api.http) = {get: "/v1/finance/journal-mappings"};
  }
  rpc GetJournalMapping(IdRequest) returns (JournalMapping) {
    option (google.api.http) = {get: "/v1/finance/journal-mappings/{id}"};
  }
  rpc CreateJournalMapping(JournalMappingInput) returns (JournalMapping) {
    option (google.api.http) = {
      post: "/v1/finance/journal-mappings"
      body: "*"
    };
  }
  rpc UpdateJournalMapping(UpdateJournalMappingRequest) returns (JournalMapping) {
    option (google.api.http) = {
      patch: "/v1/finance/journal-mappings/{id}"
      body: "input"
    };
  }
  rpc DeleteJournalMapping(IdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/journal-mappings/{id}"};
  }
}

message IdRequest {
  string id = 1;
}

message AccountType {
  string id = 1;
  string code = 2;
  string name = 3;
  EntrySide normal_balance = 4;
  int32 sort_order = 5;
  bool is_active = 6;
  int32 account_count = 7;
}

message AccountTypeInput {
  string code = 1;
  string name = 2;
  EntrySide normal_balance = 3;
  int32 sort_order = 4;
  bool is_active = 5;
}

message UpdateAccountTypeRequest {
  string id = 1;
  AccountTypeInput input = 2;
}

message ListAccountTypesRequest {
  bool include_inactive = 1;
}

message ListAccountTypesResponse {
  repeated AccountType account_types = 1;
}

message Account {
  string id = 1;
  // Compact 7-digit code ("1101001") and its display form ("1 1 01 001").
  string code = 2;
  string code_display = 3;
  string name = 4;
  optional string parent_id = 5;
  string account_type_id = 6;
  string account_type_code = 7;
  string account_type_name = 8;
  // The type's normal balance, flipped for contra accounts.
  EntrySide normal_balance = 9;
  int32 level = 10;
  bool is_postable = 11;
  bool is_contra = 12;
  bool is_cash_bank = 13;
  // OPERATING, INVESTING, FINANCING, NON_CASH or empty.
  string cash_flow_category = 14;
  string description = 15;
  bool is_active = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message AccountInput {
  string code = 1;
  string name = 2;
  optional string parent_id = 3;
  string account_type_id = 4;
  bool is_contra = 5;
  bool is_cash_bank = 6;
  string cash_flow_category = 7;
  string description = 8;
  bool is_active = 9;
}

message UpdateAccountRequest {
  string id = 1;
  AccountInput input = 2;
}

message ListAccountsRequest {
  string account_type_id = 1;
  optional bool is_postable = 2;
  optional bool is_cash_bank = 3;
  optional bool is_active = 4;
  string cash_flow_category = 5;
  string search = 6;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message ImportAccountsRequest {
  bytes file = 1;
  string mode = 2;
}

message ImportIssue {
  int32 row = 1;
  string code = 2;
  string message = 3;
}

message ImportPreviewRow {
  int32 source_row = 1;
  string code = 2;
  string name = 3;
  string parent_code = 4;
  string account_type_code = 5;
  // create, update, skip or error.
  string action = 6;
  string message = 7;
}

message ImportAccountsResponse {
  string mode = 1;
  repeated ImportIssue issues = 2;
  repeated ImportPreviewRow preview = 3;
  int32 create_count = 4;
  int32 update_count = 5;
  int32 skip_count = 6;
  int32 error_count = 7;
  string message = 8;
}

message PostableAccount {
  string id = 1;
  string code = 2;
  string code_display = 3;
  string name = 4;
  bool is_cash_bank = 5;
  string account_type_code = 6;
}

message ListPostableAccountsResponse {
  repeated PostableAccount accounts = 1;
}

message JournalEvent {
  string event_code = 1;
  string name = 2;
  string description = 3;
  string module = 4;
}

message ListJournalEventsResponse {
  repeated JournalEvent events = 1;
  repeated string modules = 2;
  repeated string amount_sources = 3;
}

message JournalMappingLine {
  string id = 1;
  EntrySide entry_side = 2;
  string line_role = 3;
  optional string account_id = 4;
  string account_code = 5;
  string account_name = 6;
  // TOTAL, SUBTOTAL, TAX, COGS, PAID, DISCOUNT, SERVICE_CHARGE.
  string amount_source = 7;
  int32 sort_order = 8;
  bool is_required = 9;
}

message JournalMapping {
  string id = 1;
  string event_code = 2;
  string name = 3;
  string description = 4;
  string module = 5;
  bool is_active = 6;
  // Every required line has an account.
  bool is_ready = 7;
  repeated JournalMappingLine lines = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message JournalMappingLineInput {
  EntrySide entry_side = 1;
  string line_role = 2;
  optional string account_id = 3;
  string amount_source = 4;
  optional int32 sort_order = 5;
  optional bool is_required = 6;
}

message JournalMappingInput {
  string event_code = 1;
  string name = 2;
  string description = 3;
  string module = 4;
  bool is_active = 5;
  repeated JournalMappingLineInput lines = 6;
}

message UpdateJournalMappingRequest {
  string id = 1;
  JournalMappingInput input = 2;
}

message ListJournalMappingsRequest {
  string search = 1;
  string module = 2;
  optional bool is_active = 3;
}

message ListJournalMappingsResponse {
  repeated JournalMapping mappings = 1;
}

// ─────────────────────────────────────────────────────────────
// FiscalService: fiscal years, periods, beginning balance
// ─────────────────────────────────────────────────────────────

service FiscalService {
  rpc ListFiscalYears(ListFiscalYearsRequest) returns (ListFiscalYearsResponse) {
    option (google.api.http) = {get: "/v1/finance/fiscal-years"};
  }
  rpc GetFiscalYear(IdRequest) returns (FiscalYear) {
    option (google.api.http) = {get: "/v1/finance/fiscal-years/{id}"};
  }
  rpc CreateFiscalYear(FiscalYearInput) returns (FiscalYear) {
    option (google.api.http) = {
      post: "/v1/finance/fiscal-years"
      body: "*"
    };
  }
  rpc UpdateFiscalYear(UpdateFiscalYearRequest) returns (FiscalYear) {
    option (google.api.http) = {
      patch: "/v1/finance/fiscal-years/{id}"
      body: "input"
    };
  }
  rpc DeleteFiscalYear(IdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/fiscal-years/{id}"};
  }
  rpc ListFiscalPeriods(ListFiscalPeriodsRequest) returns (ListFiscalPeriodsResponse) {
    option (google.api.http) = {get: "/v1/finance/fiscal-periods"};
  }
  rpc OpenFiscalPeriod(OpenFiscalPeriodRequest) returns (FiscalPeriod) {
    option (google.api.http) = {
      post: "/v1/finance/fiscal-periods/{id}:open"
      body: "*"
    };
  }
  rpc GetPeriodClosePreview(IdRequest) returns (PeriodClosePreview) {
    option (google.api.http) = {get: "/v1/finance/fiscal-periods/{id}/close-preview"};
  }
  rpc CloseFiscalPeriod(IdRequest) returns (FiscalPeriod) {
    option (google.api.http) = {post: "/v1/finance/fiscal-periods/{id}:close"};
  }
  // Whether a journal can be dated on `date`, and how to open its period.
  rpc GetFiscalCoverage(GetFiscalCoverageRequest) returns (FiscalCoverage) {
    option (google.api.http) = {get: "/v1/finance/fiscal-coverage"};
  }
  rpc GetBeginningBalance(IdRequest) returns (BeginningBalance) {
    option (google.api.http) = {get: "/v1/finance/fiscal-years/{id}/beginning-balance"};
  }
  rpc SaveBeginningBalance(SaveBeginningBalanceRequest) returns (SaveBeginningBalanceResponse) {
    option (google.api.http) = {
      put: "/v1/finance/fiscal-years/{id}/beginning-balance"
      body: "*"
    };
  }
}

message FiscalPeriod {
  string id = 1;
  string fiscal_year_id = 2;
  int32 period_no = 3;
  string name = 4;
  string start_date = 5;
  string end_date = 6;
  PeriodStatus status = 7;
  string fiscal_year_code = 8;
  string fiscal_year_name = 9;
  bool fiscal_year_is_active = 10;
  int32 posted_count = 11;
  int32 draft_count = 12;
}

message FiscalYear {
  string id = 1;
  string code = 2;
  string name = 3;
  string start_date = 4;
  string end_date = 5;
  bool is_active = 6;
  repeated FiscalPeriod periods = 7;
  int32 open_periods_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message FiscalPeriodInput {
  int32 period_no = 1;
  string name = 2;
  string start_date = 3;
  string end_date = 4;
  PeriodStatus status = 5;
}

message FiscalYearInput {
  string code = 1;
  string name = 2;
  string start_date = 3;
  string end_date = 4;
  bool is_active = 5;
  // Empty: twelve monthly periods are generated, all CLOSED except the first.
  repeated FiscalPeriodInput periods = 6;
}

message UpdateFiscalYearRequest {
  string id = 1;
  FiscalYearInput input = 2;
}

message ListFiscalYearsRequest {
  string search = 1;
  optional bool is_active = 2;
}

message ListFiscalYearsResponse {
  repeated FiscalYear fiscal_years = 1;
}

message ListFiscalPeriodsRequest {
  string fiscal_year_id = 1;
  PeriodStatus status = 2;
  string search = 3;
}

message ListFiscalPeriodsResponse {
  repeated FiscalPeriod periods = 1;
}

message OpenFiscalPeriodRequest {
  string id = 1;
  // Close the earlier OPEN periods of the same year first.
  bool close_previous = 2;
}

message DraftEntryRef {
  string id = 1;
  string entry_no = 2;
  string entry_date = 3;
  string description = 4;
}

message PeriodClosePreview {
  FiscalPeriod period = 1;
  int32 posted_count = 2;
  int32 draft_count = 3;
  repeated DraftEntryRef draft_entries = 4;
  bool can_close = 5;
  repeated string blockers = 6;
}

message GetFiscalCoverageRequest {
  string date = 1;
}

message FiscalCoverage {
  string date = 1;
  bool ready = 2;
  optional FiscalPeriod period = 3;
  optional FiscalOpenSuggestion suggestion = 4;
}

message FiscalOpenSuggestion {
  FiscalPeriod period = 1;
  bool can_open = 2;
  repeated FiscalPeriod close_previous = 3;
  string message = 4;
}

message BeginningBalanceLine {
  string account_id = 1;
  string account_code = 2;
  string account_name = 3;
  string account_type_code = 4;
  EntrySide normal_balance = 5;
  bool is_contra = 6;
  string suggested_amount = 7;
  string amount = 8;
  EntrySide entry_side = 9;
  // PRIOR_BS, RETAINED_EARNINGS or MANUAL.
  string source = 10;
}

message BeginningBalance {
  string fiscal_year_id = 1;
  string fiscal_year_code = 2;
  string fiscal_year_name = 3;
  string start_date = 4;
  string period_id = 5;
  string period_name = 6;
  optional FiscalYear prior_fiscal_year = 7;
  bool prior_fully_closed = 8;
  optional PostableAccount retained_earnings_account = 9;
  repeated BeginningBalanceLine lines = 10;
  string total_debit = 11;
  string total_credit = 12;
  string existing_entry_id = 13;
  DocumentStatus existing_status = 14;
  bool can_edit = 15;
  bool is_first_year = 16;
  string message = 17;
}

message BeginningBalanceLineInput {
  string account_id = 1;
  EntrySide entry_side = 2;
  string amount = 3;
  string memo = 4;
}

message SaveBeginningBalanceRequest {
  string id = 1;
  repeated BeginningBalanceLineInput lines = 2;
  bool post = 3;
}

message SaveBeginningBalanceResponse {
  string entry_id = 1;
  DocumentStatus status = 2;
}

// ─────────────────────────────────────────────────────────────
// JournalService: journal entries and automatic posting log
// ─────────────────────────────────────────────────────────────

service JournalService {
  rpc ListJournalEntries(ListJournalEntriesRequest) returns (ListJournalEntriesResponse) {
    option (google.api.http) = {get: "/v1/finance/journal-entries"};
  }
  rpc GetJournalEntry(IdRequest) returns (JournalEntry) {
    option (google.api.http) = {get: "/v1/finance/journal-entries/{id}"};
  }
  rpc CreateJournalEntry(JournalEntryInput) returns (JournalEntry) {
    option (google.api.http) = {
      post: "/v1/finance/journal-entries"
      body: "*"
    };
  }
  rpc UpdateJournalEntry(UpdateJournalEntryRequest) returns (JournalEntry) {
    option (google.api.http) = {
      patch: "/v1/finance/journal-entries/{id}"
      body: "input"
    };
  }
  rpc DeleteJournalEntry(IdRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/finance/journal-entries/{id}"};
  }
  rpc PostJournalEntry(IdRequest) returns (JournalEntry) {
    option (google.api.http) = {post: "/v1/finance/journal-entries/{id}:post"};
  }
  // Results of automatic posting from payroll, sales and reimbursements.
  rpc ListPostingLogs(ListPostingLogsRequest) returns (ListPostingLogsResponse) {
    option (google.api.http) = {get: "/v1/finance/posting-logs"};
  }
  // Posts again a DRAFT or SKIPPED result once the mapping is fixed.
  rpc RetryPosting(IdRequest) returns (PostingLog) {
    option (google.api.http) = {post: "/v1/finance/posting-logs/{id}:retry"};
  }
}

message JournalLine {
  string id = 1;
  string account_id = 2;
  string account_code = 3;
  string account_name = 4;
  EntrySide entry_side = 5;
  string amount = 6;
  string memo = 7;
  int32 sort_order = 8;
}

message JournalEntry {
  string id = 1;
  string entry_no = 2;
  string entry_date = 3;
  string description = 4;
  string fiscal_period_id = 5;
  string fiscal_period_name = 6;
  string fiscal_year_code = 7;
  EntryType entry_type = 8;
  DocumentStatus status = 9;
  bool is_recon = 10;
  optional google.protobuf.Timestamp posted_at = 11;
  string posted_by = 12;
  string source_module = 13;
  string source_event_code = 14;
  string source_document_type = 15;
  string source_document_id = 16;
  repeated JournalLine lines = 17;
  string total_debit = 18;
  string total_credit = 19;
  bool can_edit = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

message JournalLineInput {
  string account_id = 1;
  EntrySide entry_side = 2;
  string amount = 3;
  string memo = 4;
}

message JournalEntryInput {
  string entry_date = 1;
  string description = 2;
  bool is_recon = 3;
  repeated JournalLineInput lines = 4;
  // Save as POSTED right away (needs finance.approve).
  bool post = 5;
}

message UpdateJournalEntryRequest {
  string id = 1;
  JournalEntryInput input = 2;
}

message ListJournalEntriesRequest {
  string search = 1;
  DocumentStatus status = 2;
  EntryType entry_type = 3;
  string date_from = 4;
  string date_to = 5;
  string account_id = 6;
  int32 page_size = 7;
  int32 page = 8;
}

message ListJournalEntriesResponse {
  repeated JournalEntry entries = 1;
  int32 total = 2;
}

message PostingLog {
  string id = 1;
  string event_code = 2;
  string document_type = 3;
  string document_id = 4;
  string document_label = 5;
  // posted, draft or skipped.
  string status = 6;
  string reason = 7;
  string entry_id = 8;
  int32 attempts = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListPostingLogsRequest {
  string status = 1;
  string event_code = 2;
  int32 limit = 3;
}

message ListPostingLogsResponse {
  repeated PostingLog logs = 1;
}

// ─────────────────────────────────────────────────────────────
// CashBankService
// ─────────────────────────────────────────────────────────────

service CashBankService {
  rpc ListCashBankAccounts(google.protobuf.Empty) returns (ListCashBankAccountsResponse) {
    option (google.api.http) = {get: "/v1/finance/cash-bank"};
  }
  rpc GetCashBankLedger(LedgerRequest) returns (Ledger) {
    option (google.api.http) = {get: "/v1/finance/cash-bank/{account_id}/ledger"};
  }
  rpc ListCashMovements(ListCashMovementsRequest) returns (ListCashMovementsResponse) {
    option (google.api.http) = {get: "/v1/finance/cash-bank/movements"};
  }
  rpc CreateCashMovement(CashMovementInput) returns (CashMovement) {
    option (google.api.http) = {
      post: "/v1/finance/cash-bank/movements"
      body: "*"
    };
  }
  rpc ListCashTransfers(ListCashMovementsRequest) returns (ListCashTransfersResponse) {
    option (google.api.http) = {get: "/v1/finance/cash-bank/transfers"};
  }
  rpc CreateCashTransfer(CashTransferInput) returns (CashTransfer) {
    option (google.api.http) = {
      post: "/v1/finance/cash-bank/transfers"
      body: "*"
    };
  }
}

message CashBankAccount {
  string id = 1;
  string code = 2;
  string code_display = 3;
  string name = 4;
  EntrySide normal_balance = 5;
  string balance = 6;
  int32 movement_count = 7;
}

message ListCashBankAccountsResponse {
  repeated CashBankAccount accounts = 1;
  string total_balance = 2;
}

message LedgerRequest {
  string account_id = 1;
  string date_from = 2;
  string date_to = 3;
}

message LedgerLine {
  string line_id = 1;
  string entry_id = 2;
  string entry_no = 3;
  string entry_date = 4;
  EntryType entry_type = 5;
  string description = 6;
  string memo = 7;
  EntrySide entry_side = 8;
  string debit = 9;
  string credit = 10;
  string running_balance = 11;
}

message Ledger {
  PostableAccount account = 1;
  EntrySide normal_balance = 2;
  string date_from = 3;
  string date_to = 4;
  string opening_balance = 5;
  string closing_balance = 6;
  string total_debit = 7;
  string total_credit = 8;
  repeated LedgerLine lines = 9;
}

enum CashMovementKind {
  CASH_MOVEMENT_KIND_UNSPECIFIED = 0;
  CASH_IN = 1;
  CASH_OUT = 2;
}

message CashMovementInput {
  CashMovementKind kind = 1;
  string entry_date = 2;
  string amount = 3;
  string cash_account_id = 4;
  string offset_account_id = 5;
  string description = 6;
  string memo = 7;
}

message CashMovement {
  string id = 1;
  string entry_no = 2;
  string entry_date = 3;
  string description = 4;
  CashMovementKind kind = 5;
  string amount = 6;
  PostableAccount cash_account = 7;
  PostableAccount offset_account = 8;
  DocumentStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListCashMovementsRequest {
  CashMovementKind kind = 1;
  string search = 2;
  string date_from = 3;
  string date_to = 4;
  int32 page_size = 5;
  int32 page = 6;
}

message ListCashMovementsResponse {
  repeated CashMovement movements = 1;
  int32 total = 2;
}

message CashTransferInput {
  string entry_date = 1;
  string amount = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  string description = 5;
  string memo = 6;
}

message CashTransfer {
  string id = 1;
  string entry_no = 2;
  string entry_date = 3;
  string description = 4;
  string amount = 5;
  PostableAccount from_account = 6;
  PostableAccount to_account = 7;
  DocumentStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListCashTransfersResponse {
  repeated CashTransfer transfers = 1;
  int32 total = 2;
}

// ─────────────────────────────────────────────────────────────
// Invoices and payments, shared by PayableService and ReceivableService
// ─────────────────────────────────────────────────────────────

message Invoice {
  string id = 1;
  LedgerKind kind = 2;
  string invoice_no = 3;
  string invoice_date = 4;
  string due_date = 5;
  // Vendor (AP) or client (AR).
  string party_name = 6;
  // Vendor bill number (AP) or sales invoice number (AR).
  string reference = 7;
  // Expense (AP) or revenue (AR) account; empty uses the mapping default.
  string account_id = 8;
  string account_name = 9;
  string currency = 10;
  string subtotal = 11;
  string tax_amount = 12;
  string total_amount = 13;
  DocumentStatus status = 14;
  string description = 15;
  string sales_invoice_id = 16;
  string client_id = 17;
  string deal_id = 18;
  string allocated_amount = 19;
  string outstanding_amount = 20;
  // paid, partial, overdue or unpaid.
  string payment_status = 21;
  string journal_entry_id = 22;
  optional google.protobuf.Timestamp posted_at = 23;
  google.protobuf.Timestamp created_at = 24;
}

message InvoiceInput {
  string invoice_date = 1;
  string due_date = 2;
  string party_name = 3;
  string reference = 4;
  string account_id = 5;
  string subtotal = 6;
  string tax_amount = 7;
  string description = 8;
  string client_id = 9;
}

message UpdateInvoiceRequest {
  string id = 1;
  InvoiceInput input = 2;
}

message ListInvoicesRequest {
  DocumentStatus status = 1;
  string payment_status = 2;
  string search = 3;
  int32 page_size = 4;
  int32 page = 5;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  int32 total = 2;
}

message AgingRequest {
  string as_of = 1;
}

message AgingBucket {
  // current, 1_30, 31_60, 61_90, 90_plus.
  string bucket = 1;
  int32 invoice_count = 2;
  string amount = 3;
}

message Aging {
  string as_of = 1;
  repeated AgingBucket buckets = 2;
  repeated Invoice invoices = 3;
  string total_outstanding = 4;
}

message Allocation {
  string invoice_id = 1;
  string invoice_no = 2;
  string amount = 3;
}

message Payment {
  string id = 1;
  LedgerKind kind = 2;
  string payment_no = 3;
  string payment_date = 4;
  string amount = 5;
  string method = 6;
  string cash_account_id = 7;
  string cash_account_name = 8;
  string reference_number = 9;
  string notes = 10;
  DocumentStatus status = 11;
  string party_name = 12;
  repeated Allocation allocations = 13;
  string void_reason = 14;
  optional google.protobuf.Timestamp voided_at = 15;
  string journal_entry_id = 16;
  google.protobuf.Timestamp created_at = 17;
}

message PaymentInput {
  string payment_date = 1;
  string method = 2;
  // Cash or bank account; empty uses the mapping default.
  string cash_account_id = 3;
  string reference_number = 4;
  string notes = 5;
  repeated AllocationInput allocations = 6;
}

message AllocationInput {
  string invoice_id = 1;
  string amount = 2;
}

message ListPaymentsRequest {
  string search = 1;
  int32 page_size = 2;
  int32 page = 3;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32 total = 2;
}

message PaymentResult {
  Payment payment = 1;
  repeated Invoice invoices = 2;
  // Journal outcome ("jurnal posted", "jurnal draft: ...").
  string note = 3;
}

message InvoiceResult {
  Invoice invoice = 1;
  string note = 2;
}

message VoidPaymentRequest {
  string id = 1;
  string reason = 2;
}

