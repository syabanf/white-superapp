  bool active = 2;
}
message WriteOffRequest {
  string invoice_id = 1;
  string write_off_date = 2;
  // Empty writes off all that is outstanding.
  string amount = 3;
  string expense_account_id = 4;
  string reason = 5;
}
message TaxPosition {
  string account_id = 1;
  string code = 2;
  string name = 3;
  string kind = 4;
  string balance = 5;
}
message ListTaxPositionsRequest {
  string as_of = 1;
}
message ListTaxPositionsResponse {
  repeated TaxPosition positions = 1;
}
message TaxRemittance {
  string id = 1;
  string remit_no = 2;
  string period = 3;
  string remit_date = 4;
  string account_id = 5;
  string account_name = 6;
  string cash_account_id = 7;
  string cash_account_name = 8;
  string amount = 9;
  string ntpn = 10;
  string notes = 11;
  string status = 12;
  string journal_entry_id = 13;
  string void_reason = 14;
}
message ListTaxRemittancesRequest {}
message ListTaxRemittancesResponse {
  repeated TaxRemittance remittances = 1;
}
message CloseVatRequest {
  string period = 1;
}
message VatClosing {
  string offset = 1;
  string payable = 2;
  string compensation = 3;
  string journal_entry_id = 4;
}
message ControlSettingsRequest {}
message ControlSettings {
  bool separate_approver = 1;
}

message AuditEntry {
  string id = 1;
  string at = 2;
  string actor_id = 3;
  string actor_name = 4;
  string action = 5;
  string doc_id = 6;
  string doc_no = 7;
  string result = 8;
  string message = 9;
  string request = 10;
  string response = 11;
}
message ListAuditTrailRequest {
  string q = 1;
  string result = 2;
  string date_from = 3;
  string date_to = 4;
  int32 page = 5;
  int32 page_size = 6;
}
message ListAuditTrailResponse {
  repeated AuditEntry entries = 1;
  int32 total = 2;
}

message SalesReversal {
  string kind = 1;
  string id = 2;
  string doc_no = 3;
  string party_name = 4;
  string amount = 5;
  string reason = 6;
  string error = 7;
}
message ListSalesReversalsRequest {}
message ListSalesReversalsResponse {
  repeated SalesReversal reversals = 1;
}
message ReverseJournalRequest {
  string id = 1;
  string reversal_date = 2;
  string reason = 3;
}
message DisposeAssetRequest {
  string id = 1;
  string disposal_date = 2;
  string asset_account_id = 3;
  string cash_account_id = 4;
  string gain_loss_account_id = 5;
  string proceeds = 6;
  string reason = 7;
}
message GoodsReceipt {
  string id = 1;
  string receipt_no = 2;
  string document_id = 3;
  string receipt_date = 4;
  string amount = 5;
  string notes = 6;
  string status = 7;
  string void_reason = 8;
}
message PoInvoice {
  string invoice_id = 1;
  string invoice_no = 2;
  string status = 3;
  string subtotal = 4;
}
message PoMatch {
  string document_id = 1;
  string number = 2;
  string party_name = 3;
  string title = 4;
  string ordered = 5;
  string received = 6;
  string billed = 7;
  repeated GoodsReceipt receipts = 8;
  repeated PoInvoice invoices = 9;
}
message ListPoMatchesRequest {}
message ListPoMatchesResponse {
  repeated PoMatch matches = 1;
}
message MatchInvoiceRequest {
  string invoice_id = 1;
  string document_id = 2;
}
message ProjectAllocation {
  string id = 1;
  string tag_id = 2;
  string tag_name = 3;
  string client_name = 4;
  string month = 5;
  string kind = 6;
  string amount = 7;
  string notes = 8;
  // MANUAL | TIMESHEET
  string source = 9;
}
message ListProjectAllocationsResponse {
  repeated ProjectAllocation allocations = 1;
}
message AllocateFromTimesheetRequest {
  // YYYY-MM
  string month = 1;
}
message AllocateFromTimesheetResponse {
  repeated ProjectAllocation allocations = 1;
  // HR projects without a Finance tag.
  repeated string skipped = 2;
}

// ─────────────────────────────────────────────────────────────
// CompanyService: the company profile behind every letterhead
// ─────────────────────────────────────────────────────────────

service CompanyService {
  // Any signed-in user, and other services (Sales prints it on invoices).
  rpc GetCompanyProfile(google.protobuf.Empty) returns (CompanyProfile) {
    option (google.api.http) = {get: "/v1/finance/company-profile"};
  }
  // finance.approve.
  rpc SaveCompanyProfile(CompanyProfile) returns (CompanyProfile) {
    option (google.api.http) = {put: "/v1/finance/company-profile" body: "*"};
  }
}

message CompanyProfile {
  string legal_name = 1;
  string address = 2;
  string email = 3;
  string phone = 4;
  string npwp = 5;
  string bank_name = 6;
  string bank_account_no = 7;
  string bank_account_name = 8;
  // Read only: the transfer instruction built from the bank fields.
  string bank_line = 9;
}
