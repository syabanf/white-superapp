// Money paid or received before the invoice. finance.approve for every change.
service AdvanceService {
  rpc ListAdvances(ListAdvancesRequest) returns (ListAdvancesResponse) {
    option (google.api.http) = {get: "/v1/finance/advances"};
  }
  rpc CreateAdvance(AdvanceInput) returns (Advance) {
    option (google.api.http) = {post: "/v1/finance/advances" body: "*"};
  }
  rpc ApplyAdvance(ApplyAdvanceRequest) returns (Invoice) {
    option (google.api.http) = {post: "/v1/finance/advances/{id}:apply" body: "*"};
  }
  rpc RefundAdvance(RefundAdvanceRequest) returns (Advance) {
    option (google.api.http) = {post: "/v1/finance/advances/{id}:refund" body: "*"};
  }
  rpc VoidAdvanceRefund(VoidAdvanceRequest) returns (Advance) {
    option (google.api.http) = {post: "/v1/finance/advance-refunds/{id}:void" body: "*"};
  }
  rpc VoidAdvance(VoidAdvanceRequest) returns (Advance) {
    option (google.api.http) = {post: "/v1/finance/advances/{id}:void" body: "*"};
  }
}

service AnalysisService {
  rpc GetFinancialAnalysis(FinancialAnalysisRequest) returns (FinancialAnalysis) {
    option (google.api.http) = {get: "/v1/finance/analysis"};
  }
  rpc GenerateFinancialInsight(GenerateFinancialInsightRequest) returns (FinancialInsight) {
    option (google.api.http) = {
      post: "/v1/finance/analysis/insights"
      body: "*"
    };
  }
  rpc ListFinancialInsights(ListFinancialInsightsRequest) returns (ListFinancialInsightsResponse) {
    option (google.api.http) = {get: "/v1/finance/analysis/insights"};
  }
  // Monthly ratios with a benchmark per ratio.
  rpc GetRatioTrend(RatioTrendRequest) returns (RatioTrend) {
    option (google.api.http) = {get: "/v1/finance/analysis/trend"};
  }
}

message FinancialAnalysisRequest {
  string from = 1;
  string to = 2;
  // Compare with the previous period of the same length.
  bool compare = 3;
  // With compare: "previous" (default) or "year" (same dates a year earlier).
  string compare_mode = 4;
}

// A ratio or amount with its previous-period delta. Ratios are plain
// numbers (2.35 = 2.35x); margins are percentages (12.5 = 12.5%).
message Metric {
  string key = 1;
  string label = 2;
  double value = 3;
  // Not computable (zero denominator).
  bool unavailable = 4;
  optional white.common.v1.Delta delta = 5;
  bool lower_is_better = 6;
  // pct, ratio, days, months or idr.
  string unit = 7;
}

message ExpenseItem {
  string account_id = 1;
  string account_code = 2;
  string account_name = 3;
  string amount = 4;
  string previous_amount = 5;
  double share_pct = 6;
  optional white.common.v1.Delta delta = 7;
}

message FinancialAnalysis {
  white.common.v1.DateRange current = 1;
  optional white.common.v1.DateRange previous = 2;
  repeated Metric profitability = 3;
  repeated Metric liquidity = 4;
  repeated Metric leverage = 5;
  repeated Metric efficiency = 6;
  repeated Metric cash = 7;
  repeated ExpenseItem expense_breakdown = 8;
  // Largest absolute changes vs the previous period.
  repeated ExpenseItem top_movers = 9;
  string revenue = 10;
  string net_income = 11;
  string cash_balance = 12;
}

message GenerateFinancialInsightRequest {
  string from = 1;
  string to = 2;
  // "id" (default) or "en".
  string language = 3;
}

message FinancialInsight {
  string id = 1;
  string date_from = 2;
  string date_to = 3;
  string language = 4;
  string model = 5;
  string content = 6;
  google.protobuf.Timestamp created_at = 7;
  string created_by = 8;
}

message ListFinancialInsightsRequest {
  int32 limit = 1;
}

message ListFinancialInsightsResponse {
  repeated FinancialInsight insights = 1;
}

message RatioTrendRequest {
  // Last month of the trend; defaults to today.
  string to = 1;
  // Number of months, default 12, at most 24.
  int32 months = 2;
}

message RatioPoint {
  string month = 1;
  double value = 2;
  bool unavailable = 3;
}

message RatioTrendSeries {
  string key = 1;
  string label = 2;
  // profitability, liquidity, leverage, efficiency or cash.
  string group = 3;
  string unit = 4;
  bool lower_is_better = 5;
  repeated RatioPoint points = 6;
  // Healthy threshold for an agency.
  optional double benchmark = 7;
}

message RatioTrend {
  repeated string months = 1;
  repeated RatioTrendSeries series = 2;
}

