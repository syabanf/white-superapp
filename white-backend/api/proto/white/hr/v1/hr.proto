  string id = 1;
  EmployeeRef employee = 2;
  string date = 3;
  // HH:MM
  string start_time = 4;
  string end_time = 5;
  double hours = 6;
  // employee | company
  string source = 7;
  // pending | approved | rejected | cancelled
  string status = 8;
  string reason = 9;
  string requested_by_name = 10;
  string decided_by_name = 11;
  google.protobuf.Timestamp decided_at = 12;
  string rejection_reason = 13;
  google.protobuf.Timestamp created_at = 14;
}

message ListOvertimeRequest {
  string employee_id = 1;
  string status = 2;
  // YYYY-MM
  string month = 3;
  string scope = 4;
