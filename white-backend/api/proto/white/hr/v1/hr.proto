  string message = 3;
}

message MarkPayrollRunPaidRequest {
  string run_id = 1;
  string notes = 2;
}

message MarkPayrollRunPaidResponse {
  PayrollRun run = 1;
  int32 settled_loans = 2;
  string message = 3;
}

message ListPayslipsRequest {
  string employee_id = 1;
  int32 year = 2;
  string run_id = 3;
}

message ListPayslipsResponse {
  repeated Payslip payslips = 1;
}

message PayslipRequest {
  string payslip_id = 1;
}

message PayrollAddition {
  string id = 1;
  EmployeeRef employee = 2;
  int32 period_month = 3;
  int32 period_year = 4;
  string amount = 5;
  string label = 6;
  google.protobuf.Timestamp created_at = 7;
}

message PayrollAdditionInput {
  string employee_id = 1;
  string amount = 2;
  string label = 3;
  // Optional: default the first period whose run is missing or not yet approved.
  int32 period_month = 4;
  int32 period_year = 5;
}

message PayrollAdditionRequest {
  string addition_id = 1;
}

message ListPayrollAdditionsRequest {
  int32 period_month = 1;
  int32 period_year = 2;
  string employee_id = 3;
}

message ListPayrollAdditionsResponse {
  repeated PayrollAddition additions = 1;
}

message LoanScheduleRow {
  int32 installment_no = 1;
  int32 period_month = 2;
  int32 period_year = 3;
  string amount = 4;
  string remaining_after = 5;
  bool is_paid = 6;
}

message Loan {
  string id = 1;
  EmployeeRef employee = 2;
  // kasbon | loan | emergency
  string loan_type = 3;
  string principal_amount = 4;
  string interest_rate = 5;
  int32 tenor_months = 6;
  string monthly_installment = 7;
  string remaining_balance = 8;
  string paid_amount = 9;
  // pending | approved | rejected | paid_off
  string status = 10;
  bool is_active = 11;
  string purpose = 12;
  int32 first_installment_month = 13;
  int32 first_installment_year = 14;
  string approved_by_name = 15;
  google.protobuf.Timestamp approved_at = 16;
  string rejection_reason = 17;
  google.protobuf.Timestamp created_at = 18;
  repeated LoanScheduleRow schedule = 19;
}

message ListLoansRequest {
  string employee_id = 1;
  string status = 2;
}

message ListLoansResponse {
  repeated Loan loans = 1;
}

message LoanRequest {
  string loan_id = 1;
}

message CreateLoanRequest {
  string employee_id = 1;
  string loan_type = 2;
  string principal_amount = 3;
  // Percent per month, flat; ignored for self-service requests.
  string interest_rate = 4;
  int32 tenor_months = 5;
  string purpose = 6;
}

message DecideLoanRequest {
  string loan_id = 1;
  bool approve = 2;
  string rejection_reason = 3;
}

// ─────────────────────────────────────────────────────────────
// SelfServiceService: the caller's own records (self.service)
// ─────────────────────────────────────────────────────────────

service SelfServiceService {
  rpc GetMyProfile(google.protobuf.Empty) returns (EmployeeProfile) {
    option (google.api.http) = {get: "/v1/hr/me"};
  }
  rpc GetMyHome(google.protobuf.Empty) returns (MyHome) {
    option (google.api.http) = {get: "/v1/hr/me/home"};
  }
  rpc MyClockIn(ClockInRequest) returns (AttendanceRecord) {
    option (google.api.http) = {post: "/v1/hr/me/attendance:clockIn" body: "*"};
  }
  rpc MyClockOut(ClockOutRequest) returns (AttendanceRecord) {
    option (google.api.http) = {post: "/v1/hr/me/attendance/{attendance_id}:clockOut" body: "*"};
  }
  rpc ListMyAttendance(ListMyRequest) returns (ListAttendanceResponse) {
    option (google.api.http) = {get: "/v1/hr/me/attendance"};
  }
  rpc ListMyLeaves(ListMyRequest) returns (ListLeavesResponse) {
    option (google.api.http) = {get: "/v1/hr/me/leaves"};
  }
  rpc CreateMyLeave(CreateLeaveRequest) returns (Leave) {
    option (google.api.http) = {post: "/v1/hr/me/leaves" body: "*"};
  }
  rpc CancelMyLeave(LeaveRequest) returns (Leave) {
    option (google.api.http) = {post: "/v1/hr/me/leaves/{leave_id}:cancel" body: "*"};
  }
  rpc GetMyLeaveBalance(ListMyRequest) returns (LeaveBalance) {
    option (google.api.http) = {get: "/v1/hr/me/leave-balance"};
  }
  rpc ListMyOvertime(ListMyRequest) returns (ListOvertimeResponse) {
    option (google.api.http) = {get: "/v1/hr/me/overtime"};
  }
  rpc CreateMyOvertime(CreateOvertimeRequest) returns (Overtime) {
    option (google.api.http) = {post: "/v1/hr/me/overtime" body: "*"};
  }
  // cancel own request, or approve/reject a company assignment.
  rpc DecideMyOvertime(DecideOvertimeRequest) returns (Overtime) {
    option (google.api.http) = {post: "/v1/hr/me/overtime/{overtime_id}:decide" body: "*"};
  }
  rpc ListMyLoans(ListMyRequest) returns (ListLoansResponse) {
    option (google.api.http) = {get: "/v1/hr/me/loans"};
  }
  rpc CreateMyLoan(CreateLoanRequest) returns (Loan) {
    option (google.api.http) = {post: "/v1/hr/me/loans" body: "*"};
  }
  // Paid runs only.
  rpc ListMyPayslips(ListMyRequest) returns (ListPayslipsResponse) {
    option (google.api.http) = {get: "/v1/hr/me/payslips"};
  }
  rpc GetMyPayslipPdf(PayslipRequest) returns (FileBytes) {
    option (google.api.http) = {get: "/v1/hr/me/payslips/{payslip_id}/pdf"};
  }
  rpc GetMyTeamSchedule(GetTeamScheduleRequest) returns (TeamSchedule) {
    option (google.api.http) = {get: "/v1/hr/me/team-schedule"};
  }
  rpc ListMyAnnouncements(google.protobuf.Empty) returns (ListAnnouncementsResponse) {
    option (google.api.http) = {get: "/v1/hr/me/announcements"};
  }
  // Marks it read.
  rpc GetMyAnnouncement(AnnouncementRequest) returns (Announcement) {
    option (google.api.http) = {get: "/v1/hr/me/announcements/{announcement_id}"};
  }
  // Pending leave and overtime of the caller's direct reports.
  rpc ListMyApprovals(google.protobuf.Empty) returns (MyApprovals) {
    option (google.api.http) = {get: "/v1/hr/me/approvals"};
  }
  // Personal dashboard for one month (YYYY-MM, default this month).
  rpc GetMyDashboard(MyDashboardRequest) returns (MyDashboard) {
    option (google.api.http) = {get: "/v1/hr/me/dashboard"};
  }
}

message ListMyRequest {
  // YYYY-MM (attendance, overtime) or empty for recent.
  string month = 1;
  int32 year = 2;
  string status = 3;
}

message TodayShift {
  string name = 1;
  string start_time = 2;
  string end_time = 3;
  int32 late_tolerance_minutes = 4;
}

message MyHome {
  EmployeeRef employee = 1;
  string today = 2;
  optional TodayShift today_shift = 3;
  optional AttendanceRecord today_attendance = 4;
  repeated TeamScheduleDay week = 5;
  LeaveBalance leave_balance = 6;
  int32 unread_announcements = 7;
  int32 pending_approvals = 8;
  string holiday_name = 9;
}

message MyApprovals {
  repeated Leave leaves = 1;
  repeated Overtime overtime = 2;
}

message MyDashboardRequest {
  // YYYY-MM; empty is the current month.
  string month = 1;
}

// One calendar day of the month. status: present | late | remote | absent |
// leave | holiday | off (no shift) | upcoming | missing (scheduled, no record).
message MyDashboardDay {
  string date = 1;
  string status = 2;
  // HH:MM WIB, empty when not clocked.
  string clock_in = 3;
  string clock_out = 4;
  double work_hours = 5;
  int32 late_minutes = 6;
  // Leave type code or holiday name.
  string note = 7;
  double overtime_hours = 8;
}

message MyDashboardStats {
  int32 scheduled_days = 1;
  int32 present_days = 2;
  int32 late_days = 3;
  int32 absent_days = 4;
  int32 leave_days = 5;
  // On time = present days not late / present days * 100.
  double on_time_rate = 6;
  // Attended = present days / (scheduled days so far - leave days) * 100.
  double attendance_rate = 7;
  double work_hours = 8;
  double overtime_hours = 9;
  int32 late_minutes = 10;
  // HH:MM WIB average clock-in, empty without records.
  string avg_clock_in = 11;
}

message MyDashboardMonth {
  // First day of the month.
  string month = 1;
  double on_time_rate = 2;
  // Average on-time rate of the caller's department.
  double team_on_time_rate = 3;
  double work_hours = 4;
  double overtime_hours = 5;
  string net_pay = 6;
  string gross_pay = 7;
  int32 present_days = 8;
  int32 late_days = 9;
  double leave_days = 10;
}

message MyDashboardWeek {
  // Monday of the week (may fall in the previous month).
  string week_start = 1;
  double work_hours = 2;
  int32 days = 3;
  // Scheduled hours that week inside the month.
  double target_hours = 4;
}

message MyPayslipSummary {
  string payslip_id = 1;
  int32 period_month = 2;
  int32 period_year = 3;
  string base_salary = 4;
  string allowances = 5;
  string overtime_pay = 6;
  string gross_salary = 7;
  string bpjs = 8;
  string pph21 = 9;
  string loan_deduction = 10;
  string other_deductions = 11;
  string total_deductions = 12;
  string net_salary = 13;
  double present_days = 14;
  double working_days = 15;
}

// kind: leave | overtime | loan.
message MyPendingRequest {
  string kind = 1;
  string id = 2;
  // Leave type or loan type code; empty for overtime.
  string type = 3;
  string date = 4;
  string end_date = 5;
  // Days, hours or amount as text ("2", "1.5", "2000000.00").
  string amount = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
}

// status: in | late | remote | leave | absent | not_in | off.
message MyTeamMember {
  string employee_id = 1;
  string full_name = 2;
  string position_name = 3;
  string status = 4;
  string clock_in = 5;
  // Leave type code or shift start for not_in.
  string note = 6;
}

message MyDashboard {
  EmployeeRef employee = 1;
  string month = 2;
  string today = 3;
  repeated MyDashboardDay days = 4;
  MyDashboardStats stats = 5;
  // Same stats for the previous month.
  MyDashboardStats previous = 6;
  // 12 months ending with the selected month.
  repeated MyDashboardMonth trend = 7;
  repeated MyDashboardWeek weeks = 8;
  LeaveBalance leave_balance = 9;
  repeated Leave leave_history = 10;
  optional MyPayslipSummary latest_payslip = 11;
  repeated MyPendingRequest pending = 12;
  bool is_manager = 13;
  repeated MyTeamMember team_today = 14;
}

// ─────────────────────────────────────────────────────────────
// HrReportService (hr.read)
// ─────────────────────────────────────────────────────────────

service HrReportService {
  rpc GetHrisReport(HrisReportRequest) returns (HrisReport) {
    option (google.api.http) = {get: "/v1/hr/reports/monthly"};
  }
  rpc ExportHrisReport(HrisReportRequest) returns (FileBytes) {
    option (google.api.http) = {get: "/v1/hr/reports/monthly:export"};
  }
  // HR analytics for a date range with a comparison period and dimension
  // filters. Payroll figures are filled only for hr.payroll holders.
  rpc GetHrDashboard(HrDashboardRequest) returns (HrDashboard) {
    option (google.api.http) = {get: "/v1/hr/dashboard"};
  }
}

message HrDashboardRequest {
  // YYYY-MM-DD, inclusive. Empty: this month up to today.
  string from = 1;
  string to = 2;
  // previous (same length right before) | year (same dates a year earlier).
  string compare = 3;
  string department_id = 4;
  string employment_status = 5;
  string position_id = 6;
}

message HrDashKpis {
  // Active at the end of the period.
  int32 headcount = 1;
  int32 joiners = 2;
  int32 leavers = 3;
  // Leavers / average headcount * 100.
  double turnover_rate = 4;
  int32 attendance_records = 5;
  // Records not absent / records * 100.
  double attendance_rate = 6;
  int32 late_count = 7;
  // Late / records not absent * 100.
  double late_rate = 8;
  double avg_late_minutes = 9;
  int32 absent_count = 10;
  double avg_work_hours = 11;
  // Approved leave, working days inside the period.
  double leave_days = 12;
  // Approved overtime requests.
  double overtime_hours = 13;
  // Hours * base salary / hourly divisor * multiplier.
  string overtime_cost = 14;
  string payroll_gross = 15;
  string payroll_net = 16;
  // Gross plus employer BPJS and Tapera.
  string payroll_employer_cost = 17;
  int32 payroll_employees = 18;
}

// One period bucket (day, week or month, see HrDashboard.bucket).
message HrDashBucket {
  // First day of the bucket.
  string date = 1;
  int32 headcount = 2;
  int32 joiners = 3;
  int32 leavers = 4;
  int32 attendance_records = 5;
  int32 present = 6;
  int32 late = 7;
  int32 absent = 8;
  double attendance_rate = 9;
  double late_rate = 10;
  double avg_work_hours = 11;
  double leave_days = 12;
  double overtime_hours = 13;
  string overtime_cost = 14;
  double turnover_rate = 15;
  // Payroll runs whose period starts in the bucket (monthly series).
  string payroll_gross = 16;
  string payroll_net = 17;
  string payroll_pph21 = 18;
  string payroll_bpjs_employee = 19;
  string payroll_bpjs_employer = 20;
  int32 payroll_employees = 21;
}

// A department in one month of HrDashboard.months.
message HrDashDeptMonth {
  string month = 1;
  string department_id = 2;
  int32 headcount = 3;
  int32 attendance_records = 4;
  double attendance_rate = 5;
  int32 late = 6;
  double leave_days = 7;
  double overtime_hours = 8;
  string overtime_cost = 9;
  string payroll_gross = 10;
}

// A department over the selected period.
message HrDashDept {
  string department_id = 1;
  string name = 2;
  int32 headcount = 3;
  int32 joiners = 4;
  int32 leavers = 5;
  int32 attendance_records = 6;
  double attendance_rate = 7;
  int32 late = 8;
  double late_rate = 9;
  int32 late_minutes = 10;
  int32 absent = 11;
  double avg_work_hours = 12;
  double leave_days = 13;
  double overtime_hours = 14;
  string overtime_cost = 15;
  string payroll_gross = 16;
  string payroll_employer_cost = 17;
  // Annual leave quota and days used for the year of the period end.
  int32 leave_quota = 18;
  int32 leave_used = 19;
}

// A labelled count or amount. key is a code (status, type, band) or id.
message HrDashSlice {
  string key = 1;
  string label = 2;
  double value = 3;
  int32 count = 4;
}

// A heatmap cell: row is a department id, col an ISO weekday 1..7 or a
// day of month 1..31.
message HrDashCell {
  string row = 1;
  int32 col = 2;
  int32 value = 3;
  int32 total = 4;
}

// Leave days of one type in one month of HrDashboard.months.
message HrDashTypeMonth {
  string month = 1;
  string type = 2;
  double days = 3;
}

message HrDashEmployee {
  string employee_id = 1;
  string full_name = 2;
  string department_name = 3;
  string position_name = 4;
  int32 attendance_records = 5;
  int32 late = 6;
  int32 late_minutes = 7;
  int32 absent = 8;
  double attendance_rate = 9;
  double overtime_hours = 10;
  string overtime_cost = 11;
}

// kind: leave | overtime.
message HrDashPending {
  string kind = 1;
  string id = 2;
  string employee_id = 3;
  string full_name = 4;
  string department_name = 5;
  string type = 6;
  string date = 7;
  double amount = 8;
  string status = 9;
  int32 age_days = 10;
}

// kind: contract | probation.
message HrDashExpiry {
  string kind = 1;
  string employee_id = 2;
  string full_name = 3;
  string department_name = 4;
  string contract_id = 5;
  string contract_number = 6;
  string contract_type = 7;
  string end_date = 8;
  int32 days_left = 9;
}

// Pay by position level over the payroll runs in the period.
message HrDashLevel {
  string level = 1;
  int32 employees = 2;
  string avg_base = 3;
  string avg_gross = 4;
  string min_gross = 5;
  string max_gross = 6;
}

message HrDashLoan {
  string loan_id = 1;
  string employee_id = 2;
  string full_name = 3;
  string department_name = 4;
  string loan_type = 5;
  string principal_amount = 6;
  string remaining_balance = 7;
  string monthly_installment = 8;
}

message HrDashboard {
  string from = 1;
  string to = 2;
  string compare_from = 3;
  string compare_to = 4;
  // day | week | month
  string bucket = 5;
  bool payroll_visible = 6;
  HrDashKpis current = 7;
  HrDashKpis previous = 8;
  repeated HrDashBucket buckets = 9;
  // Comparison period in the same buckets, aligned by index.
  repeated HrDashBucket previous_buckets = 10;
  // Monthly context: at least 12 months ending with the month of `to`.
  repeated HrDashBucket months = 11;
  repeated HrDashDeptMonth dept_months = 12;
  repeated HrDashDept departments = 13;
  repeated HrDashCell late_by_weekday = 14;
  repeated HrDashCell late_by_day = 15;
  // absent, sick, annual, ... (working days in the period)
  repeated HrDashSlice absence_reasons = 16;
  // Minutes between clock-in and shift start, 5-minute bins (key = bin start).
  repeated HrDashSlice clock_in_offsets = 17;
  repeated HrDashEmployee top_late = 18;
  repeated HrDashEmployee top_overtime = 19;
  repeated HrDashSlice leave_by_type = 20;
  repeated HrDashTypeMonth leave_type_months = 21;
  // 0-2, 3-7, 8-14, 15+ days waiting.
  repeated HrDashSlice pending_aging = 22;
  repeated HrDashPending pending = 23;
  repeated HrDashSlice by_status = 24;
  repeated HrDashSlice by_position = 25;
  repeated HrDashSlice by_level = 26;
  repeated HrDashSlice by_contract_type = 27;
  repeated HrDashSlice by_gender = 28;
  repeated HrDashSlice age_bands = 29;
  repeated HrDashSlice tenure_bands = 30;
  repeated HrDashExpiry expiring = 31;
  repeated HrDashLevel salary_by_level = 32;
  repeated HrDashLoan loans = 33;
  string loans_outstanding = 34;
  int32 pending_count = 35;
}

message HrisReportRequest {
  int32 month = 1;
  int32 year = 2;
}

message LabelCount {
  string label = 1;
  int32 count = 2;
}

message DailyAttendancePoint {
  string date = 1;
  int32 present = 2;
  int32 absent = 3;
  int32 late = 4;
}

message LeaveDaysByType {
  string type = 1;
  double days = 2;
}

message HrisReport {
  int32 month = 1;
  int32 year = 2;
  int32 total_active = 3;
  int32 new_hires = 4;
  int32 turnover_count = 5;
  double turnover_rate = 6;
  repeated LabelCount by_status = 7;
  repeated LabelCount by_department = 8;
  repeated LabelCount monthly_trend = 9;
  int32 attendance_records = 10;
  int32 present_count = 11;
  int32 absent_count = 12;
  int32 late_count = 13;
  double present_rate = 14;
  double late_rate = 15;
  double avg_work_hours = 16;
  repeated DailyAttendancePoint daily_trend = 17;
  int32 leave_approved_count = 18;
  int32 leave_pending_count = 19;
  double leave_total_days = 20;
  repeated LeaveDaysByType leave_by_type = 21;
}
