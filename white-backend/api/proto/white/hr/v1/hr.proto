  string reason = 5;
}

message DecideOvertimeRequest {
  string overtime_id = 1;
  // approve | reject | cancel
  string action = 2;
  string rejection_reason = 3;
}

// ─────────────────────────────────────────────────────────────
// ContractService: PKWT / PKWTT (UU 13/2003, PP 35/2021)
// ─────────────────────────────────────────────────────────────

service ContractService {
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse) {
    option (google.api.http) = {get: "/v1/hr/contracts"};
  }
  // Contracts ending within `days` (1..90, default 30) including overdue,
  // probations ending, and active employees without a contract.
  rpc ListExpiringContracts(ListExpiringContractsRequest) returns (ExpiringContracts) {
    option (google.api.http) = {get: "/v1/hr/contracts:expiring"};
  }
  rpc GetContract(ContractRequest) returns (Contract) {
    option (google.api.http) = {get: "/v1/hr/contracts/{contract_id}"};
  }
  // hr.write. Creates a numbered draft.
  rpc CreateContract(ContractInput) returns (Contract) {
    option (google.api.http) = {post: "/v1/hr/contracts" body: "*"};
  }
  // hr.write. Drafts only.
  rpc UpdateContract(UpdateContractRequest) returns (Contract) {
    option (google.api.http) = {put: "/v1/hr/contracts/{contract_id}" body: "input"};
  }
  // hr.write. activate | end | terminate | convert | renew.
  rpc ContractAction(ContractActionRequest) returns (ContractActionResult) {
    option (google.api.http) = {post: "/v1/hr/contracts/{contract_id}:action" body: "*"};
  }
  rpc DeleteContract(ContractRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/contracts/{contract_id}"};
  }
}

message Contract {
  string id = 1;
  string contract_number = 2;
  EmployeeRef employee = 3;
  // pkwt | pkwtt
  string contract_type = 4;
  // draft | active | ended | terminated | converted
  string status = 5;
  string start_date = 6;
  optional string end_date = 7;
  optional string probation_end_date = 8;
  optional string parent_contract_id = 9;
  int32 sequence = 10;
  string position_title = 11;
  string department_name = 12;
  string work_location = 13;
  string base_salary = 14;
  optional string signed_at = 15;
  string compensation_amount = 16;
  string terminated_reason = 17;
  string notes = 18;
  google.protobuf.Timestamp created_at = 19;
  // Days until end_date (negative when overdue), when it has one.
  optional int32 days_left = 20;
}

message ContractRequest {
  string contract_id = 1;
}

message ListContractsRequest {
  string employee_id = 1;
  // Default active; "all" lists every status.
  string status = 2;
  string contract_type = 3;
  string search = 4;
}

message ListContractsResponse {
  repeated Contract contracts = 1;
}

message ContractInput {
  string employee_id = 1;
  string contract_type = 2;
  string start_date = 3;
  string end_date = 4;
  string probation_end_date = 5;
  string position_title = 6;
  string department_name = 7;
  string work_location = 8;
  string base_salary = 9;
  string notes = 10;
}

message UpdateContractRequest {
  string contract_id = 1;
  ContractInput input = 2;
}

message ContractActionRequest {
  string contract_id = 1;
  string action = 2;
  string end_date = 3;
  string reason = 4;
  string signed_at = 5;
}

message ContractActionResult {
  string message = 1;
  Contract contract = 2;
  // PKWT compensation (PP 35/2021 Pasal 16) on end or terminate.
  string compensation_amount = 3;
}

message ListExpiringContractsRequest {
  int32 days = 1;
}

message ProbationEnding {
  EmployeeRef employee = 1;
  string probation_end_date = 2;
  int32 days_left = 3;
}

message ExpiringContracts {
  int32 days = 1;
  repeated Contract contracts = 2;
  repeated ProbationEnding probations = 3;
  repeated EmployeeRef without_contract = 4;
}

// ─────────────────────────────────────────────────────────────
// AnnouncementService (hr.read lists, hr.write manages)
