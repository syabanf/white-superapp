// ─────────────────────────────────────────────────────────────
// LifecycleService: onboarding and offboarding checklists
// ─────────────────────────────────────────────────────────────

service LifecycleService {
  rpc ListOnboardingTasks(GetEmployeeRequest) returns (OnboardingChecklist) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}/onboarding"};
  }
  // Adds the default WHITE checklist (skips tasks that already exist).
  rpc ApplyOnboardingTemplate(GetEmployeeRequest) returns (OnboardingChecklist) {
    option (google.api.http) = {post: "/v1/hr/employees/{employee_id}/onboarding:applyTemplate" body: "*"};
  }
  rpc AddOnboardingTask(OnboardingTaskInput) returns (OnboardingTask) {
    option (google.api.http) = {post: "/v1/hr/employees/{employee_id}/onboarding" body: "*"};
  }
  rpc UpdateOnboardingTask(UpdateOnboardingTaskRequest) returns (OnboardingTask) {
    option (google.api.http) = {put: "/v1/hr/onboarding/{task_id}" body: "*"};
  }
  rpc DeleteOnboardingTask(OnboardingTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/onboarding/{task_id}"};
  }
  rpc GetOffboarding(GetEmployeeRequest) returns (Offboarding) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}/offboarding"};
  }
  rpc StartOffboarding(StartOffboardingRequest) returns (Offboarding) {
    option (google.api.http) = {post: "/v1/hr/employees/{employee_id}/offboarding" body: "*"};
  }
  // Completing it sets the employee resigned/terminated and inactive.
  rpc UpdateOffboarding(UpdateOffboardingRequest) returns (Offboarding) {
    option (google.api.http) = {put: "/v1/hr/employees/{employee_id}/offboarding" body: "*"};
  }
}

message OnboardingTask {
  string id = 1;
  string employee_id = 2;
  string task_name = 3;
  // admin | it | hr | manager | general
  string category = 4;
  // 1 high, 2 normal, 3 low
  int32 priority = 5;
  optional string due_date = 6;
  bool is_completed = 7;
  google.protobuf.Timestamp completed_at = 8;
  string completed_by_name = 9;
  string notes = 10;
}

message OnboardingChecklist {
  string employee_id = 1;
  repeated OnboardingTask tasks = 2;
  int32 completed = 3;
  int32 total = 4;
}

message OnboardingTaskInput {
  string employee_id = 1;
  string task_name = 2;
  string category = 3;
  int32 priority = 4;
  string due_date = 5;
}

message UpdateOnboardingTaskRequest {
  string task_id = 1;
  optional bool is_completed = 2;
  string notes = 3;
  string task_name = 4;
  string due_date = 5;
}

message OnboardingTaskRequest {
  string task_id = 1;
}

message Offboarding {
  string id = 1;
  string employee_id = 2;
  // voluntary | termination | layoff | end_of_contract
  string resignation_type = 3;
  // submitted | notice_period | exit_interview | completed
  string status = 4;
  string resignation_date = 5;
  string last_working_day = 6;
  string reason = 7;
  string exit_interview_notes = 8;
  bool clearance_hr = 9;
  bool clearance_it = 10;
  bool clearance_finance = 11;
  bool clearance_manager = 12;
  string notes = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp completed_at = 15;
}

message StartOffboardingRequest {
  string employee_id = 1;
  string resignation_type = 2;
  string resignation_date = 3;
  string last_working_day = 4;
  string reason = 5;
}

message UpdateOffboardingRequest {
  string employee_id = 1;
  string status = 2;
  // hr | it | finance | manager
  string clearance_type = 3;
  optional bool cleared = 4;
  string exit_interview_notes = 5;
  string notes = 6;
}

// ─────────────────────────────────────────────────────────────
// PayrollService (hr.payroll; loans: request by self.service, decide by
// hr.approve)
// ─────────────────────────────────────────────────────────────

service PayrollService {
  rpc GetPayrollSettings(google.protobuf.Empty) returns (PayrollSettings) {
    option (google.api.http) = {get: "/v1/hr/payroll/settings"};
  }
  rpc UpdatePayrollSettings(PayrollSettings) returns (PayrollSettings) {
    option (google.api.http) = {put: "/v1/hr/payroll/settings" body: "*"};
  }
  rpc ListSalaries(ListSalariesRequest) returns (ListSalariesResponse) {
    option (google.api.http) = {get: "/v1/hr/salaries"};
  }
  // A new salary version: the previous active one ends.
  rpc CreateSalary(SalaryInput) returns (Salary) {
    option (google.api.http) = {post: "/v1/hr/salaries" body: "*"};
  }
  rpc UpdateSalary(UpdateSalaryRequest) returns (Salary) {
    option (google.api.http) = {put: "/v1/hr/salaries/{salary_id}" body: "input"};
  }
  rpc DeactivateSalary(SalaryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/salaries/{salary_id}"};
  }

  rpc ListPayrollRuns(ListPayrollRunsRequest) returns (ListPayrollRunsResponse) {
    option (google.api.http) = {get: "/v1/hr/payroll/runs"};
  }
  rpc CreatePayrollRun(CreatePayrollRunRequest) returns (PayrollRun) {
    option (google.api.http) = {post: "/v1/hr/payroll/runs" body: "*"};
  }
  rpc GetPayrollRun(PayrollRunRequest) returns (PayrollRunDetail) {
    option (google.api.http) = {get: "/v1/hr/payroll/runs/{run_id}"};
  }
  // draft or calculated runs: recalculates every active employee.
  rpc CalculatePayrollRun(CalculatePayrollRunRequest) returns (CalculatePayrollRunResponse) {
    option (google.api.http) = {post: "/v1/hr/payroll/runs/{run_id}:calculate" body: "*"};
  }
  rpc ApprovePayrollRun(PayrollRunRequest) returns (PayrollRun) {
    option (google.api.http) = {post: "/v1/hr/payroll/runs/{run_id}:approve" body: "*"};
  }
  // approved -> paid: settles loan installments and publishes
  // white.hr.payroll.paid.
  rpc MarkPayrollRunPaid(MarkPayrollRunPaidRequest) returns (MarkPayrollRunPaidResponse) {
    option (google.api.http) = {post: "/v1/hr/payroll/runs/{run_id}:markPaid" body: "*"};
  }
  rpc DeletePayrollRun(PayrollRunRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/payroll/runs/{run_id}"};
  }
  rpc ListPayslips(ListPayslipsRequest) returns (ListPayslipsResponse) {
    option (google.api.http) = {get: "/v1/hr/payslips"};
  }
  rpc GetPayslipPdf(PayslipRequest) returns (FileBytes) {
    option (google.api.http) = {get: "/v1/hr/payslips/{payslip_id}/pdf"};
  }
  // One-off taxable additions (bonus, incentive) paid with a period's run.
  rpc ListPayrollAdditions(ListPayrollAdditionsRequest) returns (ListPayrollAdditionsResponse) {
    option (google.api.http) = {get: "/v1/hr/payroll/additions"};
  }
  rpc CreatePayrollAddition(PayrollAdditionInput) returns (PayrollAddition) {
    option (google.api.http) = {post: "/v1/hr/payroll/additions" body: "*"};
  }
  rpc DeletePayrollAddition(PayrollAdditionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/payroll/additions/{addition_id}"};
  }

  // hr.payroll or hr.approve: everyone's; otherwise own loans.
  rpc ListLoans(ListLoansRequest) returns (ListLoansResponse) {
    option (google.api.http) = {get: "/v1/hr/loans"};
  }
  rpc GetLoan(LoanRequest) returns (Loan) {
    option (google.api.http) = {get: "/v1/hr/loans/{loan_id}"};
  }
  // self.service for oneself (interest free); hr.payroll for anyone.
  rpc CreateLoan(CreateLoanRequest) returns (Loan) {
    option (google.api.http) = {post: "/v1/hr/loans" body: "*"};
  }
  rpc DecideLoan(DecideLoanRequest) returns (Loan) {
    option (google.api.http) = {post: "/v1/hr/loans/{loan_id}:decide" body: "*"};
  }
}

message PayrollSettings {
  // Rates are percentages ("2.00" = 2%).
  string bpjs_tk_jht_employee = 1;
  string bpjs_tk_jht_employer = 2;
  string bpjs_tk_jp_employee = 3;
  string bpjs_tk_jp_employer = 4;
  string bpjs_tk_jkk = 5;
  string bpjs_tk_jkm = 6;
  string bpjs_kes_employee = 7;
  string bpjs_kes_employer = 8;
  string bpjs_kes_max_upah = 9;
