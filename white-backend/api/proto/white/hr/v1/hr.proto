syntax = "proto3";

package white.hr.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/syabanf/white-superapp/white-backend/gen/go/white/hr/v1;hrv1";

// NOTE: this file starts with the employee directory other services depend
// on (performance, finance, recruitment, sales). The hr service adds its
// public RPCs below; keep these messages and RPC names stable.
//
// Permissions: hr.read views, hr.write manages records, hr.approve decides
// leave, overtime, loans and attendance validation, hr.payroll runs payroll
// and salaries, self.service covers the caller's own records under
// /v1/hr/me. A direct manager (employees.manager_id) may decide the leave
// and overtime of their reports. Money is a decimal string ("1250000.00"),
// days are "YYYY-MM-DD". Status and type fields are lowercase codes listed
// next to each field; user-facing labels live in the UI.

// ─────────────────────────────────────────────────────────────
// EmployeeService: the people directory
// ─────────────────────────────────────────────────────────────

service EmployeeService {
  rpc ListEmployees(ListEmployeesRequest) returns (ListEmployeesResponse) {
    option (google.api.http) = {get: "/v1/hr/employees"};
  }
  rpc GetEmployee(GetEmployeeRequest) returns (Employee) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}"};
  }
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse) {
    option (google.api.http) = {get: "/v1/hr/departments"};
  }

  // Internal. The employee linked to an identity user (NOT_FOUND when none).
  rpc GetEmployeeByUser(GetEmployeeByUserRequest) returns (Employee);
  // Internal. Attendance totals per employee for a month (KPI auto-collect).
  rpc GetAttendanceSummary(GetAttendanceSummaryRequest) returns (GetAttendanceSummaryResponse);
}

enum EmploymentStatus {
  EMPLOYMENT_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  PROBATION = 2;
  ON_LEAVE = 3;
  RESIGNED = 4;
  TERMINATED = 5;
}

message Employee {
  string id = 1;
  // Identity user, when the employee can log in.
  optional string user_id = 2;
  string employee_no = 3;
  string full_name = 4;
  string email = 5;
  string phone = 6;
  optional string department_id = 7;
  string department_name = 8;
  optional string position_id = 9;
  string position_name = 10;
  // Direct supervisor (an employee id).
  optional string manager_id = 11;
  EmploymentStatus status = 12;
  // YYYY-MM-DD
  string join_date = 13;
  optional string end_date = 14;
  google.protobuf.Timestamp created_at = 15;
  // Identity user of the direct supervisor, when linked.
  optional string manager_user_id = 16;
}

message ListEmployeesRequest {
  // Optional filters.
  string department_id = 1;
  string manager_id = 2;
  repeated string employee_ids = 3;
  bool include_inactive = 4;
  string search = 5;
  int32 page_size = 6;
  string page_token = 7;
  string position_id = 8;
  // Position level (e.g. Staff, Manager).
  string level = 9;
  string gender = 10;
  // Employment status code.
  string employment_status = 11;
}

message ListEmployeesResponse {
  repeated Employee employees = 1;
  string next_page_token = 2;
  int32 total = 3;
}

message GetEmployeeRequest {
  string employee_id = 1;
}

message GetEmployeeByUserRequest {
  string user_id = 1;
}

message Department {
  string id = 1;
  string code = 2;
  string name = 3;
  optional string parent_id = 4;
  // Head of department (an employee id).
  optional string head_employee_id = 5;
  bool is_active = 6;
}

message ListDepartmentsRequest {
  bool include_inactive = 1;
}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}

message GetAttendanceSummaryRequest {
  repeated string employee_ids = 1;
  // YYYY-MM
  string month = 2;
}

message AttendanceSummary {
  string employee_id = 1;
  int32 working_days = 2;
  int32 present_days = 3;
  int32 late_days = 4;
  int32 absent_days = 5;
  int32 leave_days = 6;
  int32 late_minutes = 7;
  double overtime_hours = 8;
}

message GetAttendanceSummaryResponse {
  repeated AttendanceSummary summaries = 1;
}

// ─────────────────────────────────────────────────────────────
// Shared
// ─────────────────────────────────────────────────────────────

// A generated or stored file returned inline (PDF, XLSX, CSV, images).
message FileBytes {
  string file_name = 1;
  string content_type = 2;
  bytes data = 3;
}

message ActionResult {
  string message = 1;
}

message EmployeeRef {
  string id = 1;
  string full_name = 2;
  string employee_no = 3;
  string department_name = 4;
}

// ─────────────────────────────────────────────────────────────
// PeopleService: employee records and master data (hr.read / hr.write)
// ─────────────────────────────────────────────────────────────

service PeopleService {
  rpc GetEmployeeProfile(GetEmployeeRequest) returns (EmployeeProfile) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}/profile"};
  }
  rpc CreateEmployee(EmployeeInput) returns (EmployeeProfile) {
    option (google.api.http) = {post: "/v1/hr/employees" body: "*"};
  }
  rpc UpdateEmployee(UpdateEmployeeRequest) returns (EmployeeProfile) {
    option (google.api.http) = {put: "/v1/hr/employees/{employee_id}" body: "input"};
  }
  // Soft delete.
  rpc DeleteEmployee(GetEmployeeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/employees/{employee_id}"};
  }
  // Links (or with an empty user_id unlinks) an identity user.
  rpc LinkEmployeeUser(LinkEmployeeUserRequest) returns (EmployeeProfile) {
    option (google.api.http) = {post: "/v1/hr/employees/{employee_id}:linkUser" body: "*"};
  }
  rpc ListEmploymentHistory(GetEmployeeRequest) returns (ListEmploymentHistoryResponse) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}/history"};
  }
  rpc ListEmployeeDocuments(GetEmployeeRequest) returns (ListEmployeeDocumentsResponse) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}/documents"};
  }
  rpc UploadEmployeeDocument(UploadEmployeeDocumentRequest) returns (EmployeeDocument) {
    option (google.api.http) = {post: "/v1/hr/employees/{employee_id}/documents" body: "*"};
  }
  rpc DownloadEmployeeDocument(DocumentRequest) returns (FileBytes) {
    option (google.api.http) = {get: "/v1/hr/documents/{document_id}"};
  }
  rpc DeleteEmployeeDocument(DocumentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/documents/{document_id}"};
  }
  rpc GetOrgChart(GetOrgChartRequest) returns (OrgChart) {
    option (google.api.http) = {get: "/v1/hr/org-chart"};
  }

  rpc CreateDepartment(DepartmentInput) returns (Department) {
    option (google.api.http) = {post: "/v1/hr/departments" body: "*"};
  }
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (Department) {
    option (google.api.http) = {put: "/v1/hr/departments/{department_id}" body: "input"};
  }
  rpc DeleteDepartment(DepartmentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/departments/{department_id}"};
  }
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse) {
    option (google.api.http) = {get: "/v1/hr/positions"};
  }
  rpc CreatePosition(PositionInput) returns (Position) {
    option (google.api.http) = {post: "/v1/hr/positions" body: "*"};
  }
  rpc UpdatePosition(UpdatePositionRequest) returns (Position) {
    option (google.api.http) = {put: "/v1/hr/positions/{position_id}" body: "input"};
  }
  rpc DeletePosition(PositionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/positions/{position_id}"};
  }
  rpc ListEmploymentStatuses(google.protobuf.Empty) returns (ListEmploymentStatusesResponse) {
    option (google.api.http) = {get: "/v1/hr/employment-statuses"};
  }
  rpc UpsertEmploymentStatus(EmploymentStatusOption) returns (EmploymentStatusOption) {
    option (google.api.http) = {put: "/v1/hr/employment-statuses/{code}" body: "*"};
  }
  rpc DeleteEmploymentStatus(EmploymentStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/employment-statuses/{code}"};
  }
}

message EmployeeProfile {
  Employee employee = 1;
  // Master employment status code: permanent, contract, probation,
  // intern, resigned, terminated (or any code added in master data).
  string employment_status = 2;
  string employment_status_name = 3;
  string manager_name = 4;
  string nik = 5;
  string npwp = 6;
  string bpjs_tk_no = 7;
  string bpjs_kes_no = 8;
  string birth_place = 9;
  optional string birth_date = 10;
  // male | female
  string gender = 11;
  // single | married | divorced | widowed
  string marital_status = 12;
  string religion = 13;
  string address = 14;
  optional string probation_end_date = 15;
  string bank_name = 16;
  string bank_account_no = 17;
  string bank_account_name = 18;
  string emergency_contact_name = 19;
  string emergency_contact_phone = 20;
  string emergency_contact_relation = 21;
  bool is_active = 22;
  google.protobuf.Timestamp updated_at = 23;
  // Email of the linked identity user, when any.
  string user_email = 24;
}

message EmployeeInput {
  // Empty: the next free EMP-<year>-<00001>.
  string employee_no = 1;
  string full_name = 2;
  string email = 3;
  string phone = 4;
  string department_id = 5;
  string position_id = 6;
  string manager_id = 7;
  string employment_status = 8;
  string join_date = 9;
  string end_date = 10;
  string probation_end_date = 11;
  string nik = 12;
  string npwp = 13;
  string bpjs_tk_no = 14;
  string bpjs_kes_no = 15;
  string birth_place = 16;
  string birth_date = 17;
  string gender = 18;
  string marital_status = 19;
  string religion = 20;
  string address = 21;
  string bank_name = 22;
  string bank_account_no = 23;
  string bank_account_name = 24;
  string emergency_contact_name = 25;
  string emergency_contact_phone = 26;
  string emergency_contact_relation = 27;
  // Only on create: links an identity user right away.
  string user_id = 28;
}

message UpdateEmployeeRequest {
  string employee_id = 1;
  EmployeeInput input = 2;
}

message LinkEmployeeUserRequest {
  string employee_id = 1;
  string user_id = 2;
}

message EmploymentHistoryEntry {
  string id = 1;
  // update | contract | offboarding
  string change_type = 2;
  string notes = 3;
  string prev_employment_status = 4;
  string new_employment_status = 5;
  string prev_department = 6;
  string new_department = 7;
  string prev_position = 8;
  string new_position = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListEmploymentHistoryResponse {
  repeated EmploymentHistoryEntry entries = 1;
}

message EmployeeDocument {
  string id = 1;
  string employee_id = 2;
  // ktp | npwp | kk | ijazah | cv | contract | certificate | other
  string doc_type = 3;
  string name = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListEmployeeDocumentsResponse {
  repeated EmployeeDocument documents = 1;
}

message UploadEmployeeDocumentRequest {
  string employee_id = 1;
  string doc_type = 2;
  string name = 3;
  // PDF, JPEG, PNG or WebP (magic bytes checked), max 10 MB.
  bytes data = 4;
}

message DocumentRequest {
  string document_id = 1;
}

message GetOrgChartRequest {
  // Optional: the subtree under this employee.
  string root_employee_id = 1;
}

message OrgNode {
  string employee_id = 1;
  string full_name = 2;
  string position_name = 3;
  string department_name = 4;
  repeated OrgNode reports = 5;
}

message OrgChart {
  repeated OrgNode roots = 1;
  int32 total = 2;
}

message DepartmentInput {
  string code = 1;
  string name = 2;
  string parent_id = 3;
  string head_employee_id = 4;
  bool is_active = 5;
}

message UpdateDepartmentRequest {
  string department_id = 1;
  DepartmentInput input = 2;
}

message DepartmentRequest {
  string department_id = 1;
}

message Position {
  string id = 1;
  string title = 2;
  optional string department_id = 3;
  string department_name = 4;
  // staff | senior | lead | manager | director
  string level = 5;
  string salary_min = 6;
  string salary_max = 7;
  bool is_active = 8;
}

message PositionInput {
  string title = 1;
  string department_id = 2;
  string level = 3;
  string salary_min = 4;
  string salary_max = 5;
  bool is_active = 6;
}

message UpdatePositionRequest {
  string position_id = 1;
  PositionInput input = 2;
}

message PositionRequest {
  string position_id = 1;
}

message ListPositionsRequest {
  string department_id = 1;
  bool include_inactive = 2;
}

message ListPositionsResponse {
  repeated Position positions = 1;
}

message EmploymentStatusOption {
  string code = 1;
  string name = 2;
  bool is_active = 3;
  int32 sort_order = 4;
}

message EmploymentStatusRequest {
  string code = 1;
}

message ListEmploymentStatusesResponse {
  repeated EmploymentStatusOption statuses = 1;
}

// ─────────────────────────────────────────────────────────────
// AttendanceService
// ─────────────────────────────────────────────────────────────

service AttendanceService {
  // Clock in. With hr.write the caller may clock someone else in
  // (employee_id) or back-fill a date; otherwise self.service and own record.
  rpc ClockIn(ClockInRequest) returns (AttendanceRecord) {
    option (google.api.http) = {post: "/v1/hr/attendance:clockIn" body: "*"};
  }
  rpc ClockOut(ClockOutRequest) returns (AttendanceRecord) {
    option (google.api.http) = {post: "/v1/hr/attendance/{attendance_id}:clockOut" body: "*"};
  }
  // hr.read: anyone; otherwise own rows only.
  rpc ListAttendance(ListAttendanceRequest) returns (ListAttendanceResponse) {
    option (google.api.http) = {get: "/v1/hr/attendance"};
  }
  // hr.read. Every active employee with the shift of the day, attendance
  // and approved leave folded into one status.
  rpc GetDailyRoster(GetDailyRosterRequest) returns (DailyRoster) {
    option (google.api.http) = {get: "/v1/hr/attendance/roster"};
  }
  // hr.approve.
  rpc ValidateAttendance(ValidateAttendanceRequest) returns (AttendanceRecord) {
    option (google.api.http) = {post: "/v1/hr/attendance/{attendance_id}:validate" body: "*"};
  }
  rpc GetAttendancePhoto(GetAttendancePhotoRequest) returns (FileBytes) {
    option (google.api.http) = {get: "/v1/hr/attendance/{attendance_id}/photo"};
  }
  // hr.read. XLSX "Rekap Absensi".
  rpc ExportAttendance(ExportAttendanceRequest) returns (FileBytes) {
    option (google.api.http) = {get: "/v1/hr/attendance:export"};
  }
}

message GeoLocation {
  double latitude = 1;
  double longitude = 2;
  double accuracy = 3;
  string address = 4;
}

message ClockInRequest {
  string employee_id = 1;
  string date = 2;
  // Optional selfie: JPEG, PNG or WebP (magic bytes checked), max 2 MB.
  bytes photo = 3;
  optional GeoLocation location = 4;
  string notes = 5;
}

message ClockOutRequest {
  string attendance_id = 1;
  bytes photo = 2;
  optional GeoLocation location = 3;
  string notes = 4;
}

message AttendanceRecord {
  string id = 1;
  EmployeeRef employee = 2;
  string date = 3;
  google.protobuf.Timestamp clock_in = 4;
  google.protobuf.Timestamp clock_out = 5;
  optional GeoLocation clock_in_location = 6;
  optional GeoLocation clock_out_location = 7;
  bool has_clock_in_photo = 8;
  bool has_clock_out_photo = 9;
  double work_hours = 10;
  // present | late | absent | half_day | remote
  string status = 11;
  bool is_late = 12;
  int32 late_minutes = 13;
  double overtime_hours = 14;
  string shift_id = 15;
  string shift_name = 16;
  google.protobuf.Timestamp scheduled_start = 17;
  google.protobuf.Timestamp scheduled_end = 18;
  bool is_validated = 19;
  string validated_by_name = 20;
  google.protobuf.Timestamp validated_at = 21;
  string validation_notes = 22;
  string notes = 23;
}

message ListAttendanceRequest {
  string employee_id = 1;
  string start_date = 2;
  string end_date = 3;
  string status = 4;
  bool only_late = 5;
  bool only_unvalidated = 6;
  int32 page = 7;
  int32 page_size = 8;
  string department_id = 9;
}

message ListAttendanceResponse {
  repeated AttendanceRecord records = 1;
  int32 total = 2;
}

message GetDailyRosterRequest {
  // Default today (WIB).
  string date = 1;
  string department_id = 2;
}

message RosterEntry {
  EmployeeRef employee = 1;
  string shift_id = 2;
  string shift_name = 3;
  string shift_start = 4;
  string shift_end = 5;
  // hadir | terlambat | belum_absen | absen | cuti | libur_nasional | libur | tanpa_jadwal
  string status = 6;
  bool is_overdue = 7;
  string attendance_id = 8;
  google.protobuf.Timestamp clock_in = 9;
  google.protobuf.Timestamp clock_out = 10;
  int32 late_minutes = 11;
  string leave_type = 12;
}

message DailyRoster {
  string date = 1;
  string holiday_name = 2;
  repeated RosterEntry entries = 3;
  map<string, int32> summary = 4;
}

message ValidateAttendanceRequest {
  string attendance_id = 1;
  // Optional status correction: present | late | absent | half_day | remote.
  string status = 2;
  string notes = 3;
}

message GetAttendancePhotoRequest {
  string attendance_id = 1;
  // in | out
  string kind = 2;
}

message ExportAttendanceRequest {
  string employee_id = 1;
  string start_date = 2;
  string end_date = 3;
  string status = 4;
}

// ─────────────────────────────────────────────────────────────
// ScheduleService: shifts, weekly schedules, public holidays
// ─────────────────────────────────────────────────────────────

service ScheduleService {
  rpc ListShifts(ListShiftsRequest) returns (ListShiftsResponse) {
    option (google.api.http) = {get: "/v1/hr/shifts"};
  }
  rpc CreateShift(ShiftInput) returns (Shift) {
    option (google.api.http) = {post: "/v1/hr/shifts" body: "*"};
  }
  rpc UpdateShift(UpdateShiftRequest) returns (Shift) {
    option (google.api.http) = {put: "/v1/hr/shifts/{shift_id}" body: "input"};
  }
  // A shift already used by a schedule or attendance is deactivated.
  rpc DeleteShift(ShiftRequest) returns (ActionResult) {
    option (google.api.http) = {delete: "/v1/hr/shifts/{shift_id}"};
  }
  rpc GetEmployeeSchedule(GetEmployeeRequest) returns (EmployeeSchedule) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}/schedule"};
  }
  // Starts a new weekly pattern on effective_from; the running one ends
  // the day before.
  rpc SetEmployeeSchedule(SetEmployeeScheduleRequest) returns (EmployeeSchedule) {
    option (google.api.http) = {put: "/v1/hr/employees/{employee_id}/schedule" body: "*"};
  }
  // hr.read: any department; self.service: the caller's department.
  rpc GetTeamSchedule(GetTeamScheduleRequest) returns (TeamSchedule) {
    option (google.api.http) = {get: "/v1/hr/schedule/team"};
  }
  rpc ListHolidays(ListHolidaysRequest) returns (ListHolidaysResponse) {
    option (google.api.http) = {get: "/v1/hr/holidays"};
  }
  rpc CreateHoliday(HolidayInput) returns (Holiday) {
    option (google.api.http) = {post: "/v1/hr/holidays" body: "*"};
  }
  rpc UpdateHoliday(UpdateHolidayRequest) returns (Holiday) {
    option (google.api.http) = {put: "/v1/hr/holidays/{holiday_id}" body: "input"};
  }
  rpc DeleteHoliday(HolidayRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/hr/holidays/{holiday_id}"};
  }
}

message Shift {
  string id = 1;
  string name = 2;
  // HH:MM
  string start_time = 3;
  string end_time = 4;
  int32 break_minutes = 5;
  int32 late_tolerance_minutes = 6;
  bool is_overnight = 7;
  bool is_active = 8;
  int32 sort_order = 9;
}

message ShiftInput {
  string name = 1;
  string start_time = 2;
  string end_time = 3;
  int32 break_minutes = 4;
  int32 late_tolerance_minutes = 5;
  bool is_overnight = 6;
  bool is_active = 7;
  int32 sort_order = 8;
}

message UpdateShiftRequest {
  string shift_id = 1;
  ShiftInput input = 2;
}

message ShiftRequest {
  string shift_id = 1;
}

message ListShiftsRequest {
  bool include_inactive = 1;
}

message ListShiftsResponse {
  repeated Shift shifts = 1;
}

message ScheduleDay {
  // 1 = Monday ... 7 = Sunday
  int32 day_of_week = 1;
  // Empty: day off.
  string shift_id = 2;
  string shift_name = 3;
  string effective_from = 4;
  optional string effective_to = 5;
}

message EmployeeSchedule {
  string employee_id = 1;
  repeated ScheduleDay current = 2;
  repeated ScheduleDay history = 3;
}

message SetEmployeeScheduleRequest {
  string employee_id = 1;
  string effective_from = 2;
  repeated ScheduleDay days = 3;
}

message GetTeamScheduleRequest {
  string department_id = 1;
  // Any day of the week to show (Monday to Sunday); default this week.
  string week_of = 2;
}

message TeamScheduleDay {
  string date = 1;
  // shift | libur | libur_nasional | cuti | none
  string status = 2;
  string shift_name = 3;
  string start_time = 4;
  string end_time = 5;
}

message TeamScheduleRow {
  EmployeeRef employee = 1;
  repeated TeamScheduleDay days = 2;
}

message TeamSchedule {
  string week_start = 1;
  repeated TeamScheduleRow rows = 2;
}

message Holiday {
  string id = 1;
  string holiday_date = 2;
  string name = 3;
  // nasional | cuti_bersama | perusahaan
  string type = 4;
  bool deducts_leave = 5;
  // draft | aktif
  string status = 6;
  string note = 7;
}

message HolidayInput {
  string holiday_date = 1;
  string name = 2;
  string type = 3;
  // Default: true only for cuti_bersama.
  optional bool deducts_leave = 4;
  string status = 5;
  string note = 6;
}

message UpdateHolidayRequest {
  string holiday_id = 1;
  HolidayInput input = 2;
}

message HolidayRequest {
  string holiday_id = 1;
}

message ListHolidaysRequest {
  // Default this year.
  int32 year = 1;
}

message ListHolidaysResponse {
  repeated Holiday holidays = 1;
}

// ─────────────────────────────────────────────────────────────
// LeaveService
// ─────────────────────────────────────────────────────────────

service LeaveService {
  rpc ListLeaveTypes(google.protobuf.Empty) returns (ListLeaveTypesResponse) {
    option (google.api.http) = {get: "/v1/hr/leave-types"};
  }
  // hr.read: anyone. Otherwise own requests, or with scope=approvals the
  // requests of the caller's direct reports.
  rpc ListLeaves(ListLeavesRequest) returns (ListLeavesResponse) {
    option (google.api.http) = {get: "/v1/hr/leaves"};
  }
  rpc GetLeave(LeaveRequest) returns (Leave) {
    option (google.api.http) = {get: "/v1/hr/leaves/{leave_id}"};
  }
  // hr.write files leave for any employee; self.service for oneself.
  rpc CreateLeave(CreateLeaveRequest) returns (Leave) {
    option (google.api.http) = {post: "/v1/hr/leaves" body: "*"};
  }
  // Direct manager first (pending -> manager_approved), then hr.approve
  // (-> approved, annual quota consumed). Reject at either step.
  rpc DecideLeave(DecideLeaveRequest) returns (Leave) {
    option (google.api.http) = {post: "/v1/hr/leaves/{leave_id}:decide" body: "*"};
  }
  rpc CancelLeave(LeaveRequest) returns (Leave) {
    option (google.api.http) = {post: "/v1/hr/leaves/{leave_id}:cancel" body: "*"};
  }
  // Created on first read with the prorated annual quota.
  rpc GetLeaveBalance(GetLeaveBalanceRequest) returns (LeaveBalance) {
    option (google.api.http) = {get: "/v1/hr/employees/{employee_id}/leave-balance"};
  }
  // hr.write.
  rpc UpdateLeaveBalance(UpdateLeaveBalanceRequest) returns (LeaveBalance) {
    option (google.api.http) = {put: "/v1/hr/employees/{employee_id}/leave-balance" body: "*"};
  }
  // hr.read. CSV.
  rpc ExportLeaves(ListLeavesRequest) returns (FileBytes) {
    option (google.api.http) = {get: "/v1/hr/leaves:export"};
  }
}

message LeaveType {
  // annual | sick | maternity | paternity | unpaid | emergency | pilgrimage | menstrual | marriage | bereavement
  string code = 1;
  string name = 2;
  // Whether approving it consumes the annual quota.
  bool uses_annual_quota = 3;
}

message ListLeaveTypesResponse {
  repeated LeaveType types = 1;
}

message Leave {
  string id = 1;
  EmployeeRef employee = 2;
  string leave_type = 3;
  string start_date = 4;
  string end_date = 5;
  int32 total_days = 6;
  string reason = 7;
  // pending | manager_approved | approved | rejected | cancelled
  string status = 8;
  string manager_approved_by_name = 9;
  google.protobuf.Timestamp manager_approved_at = 10;
  string approved_by_name = 11;
  google.protobuf.Timestamp approved_at = 12;
  string rejection_reason = 13;
  google.protobuf.Timestamp created_at = 14;
  // Holidays inside the range that did not consume leave.
  repeated string excluded_holidays = 15;
  // What the caller may do now.
  bool can_decide = 16;
  bool can_cancel = 17;
}

message LeaveRequest {
  string leave_id = 1;
}

message ListLeavesRequest {
  string employee_id = 1;
  string status = 2;
  string leave_type = 3;
  string start_date = 4;
  string end_date = 5;
  // approvals: requests of the caller's direct reports.
  string scope = 6;
  int32 page = 7;
  int32 page_size = 8;
  string department_id = 9;
}

message ListLeavesResponse {
  repeated Leave leaves = 1;
  int32 total = 2;
}

message CreateLeaveRequest {
  string employee_id = 1;
  string leave_type = 2;
  string start_date = 3;
  string end_date = 4;
  string reason = 5;
}

message DecideLeaveRequest {
  string leave_id = 1;
  bool approve = 2;
  string rejection_reason = 3;
}

message LeaveBalance {
  string employee_id = 1;
  int32 year = 2;
  int32 annual_leave_total = 3;
  int32 annual_leave_used = 4;
  int32 annual_leave_remaining = 5;
  int32 sick_leave_used = 6;
  int32 unpaid_leave_used = 7;
  int32 other_leave_used = 8;
  // Days waiting for a decision.
  int32 pending_days = 9;
}

message GetLeaveBalanceRequest {
  string employee_id = 1;
  int32 year = 2;
}

message UpdateLeaveBalanceRequest {
  string employee_id = 1;
  int32 year = 2;
  int32 annual_leave_total = 3;
  optional int32 annual_leave_used = 4;
}

// ─────────────────────────────────────────────────────────────
