name: white-backend

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgresql://white:white@postgres:5432/white_analytics
    NATS_URL: nats://nats:4222
    AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
    INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    IDENTITY_ADDR: identity:9001
    INTEGRATIONS_ADDR: integrations:9002
    ANALYTICS_ADDR: analytics:9003
    PUBLISHING_ADDR: publishing:9004
    SEOSUITE_ADDR: seosuite:9005
    REPORTS_ADDR: reports:9006
    FINANCE_ADDR: finance:9007
    HR_ADDR: hr:9008
    RECRUITMENT_ADDR: recruitment:9009
    SALES_ADDR: sales:9010
    PERFORMANCE_ADDR: performance:9012
    CONTENT_ADDR: content:9011
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_started

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: white
      POSTGRES_PASSWORD: white
      POSTGRES_DB: white_analytics
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U white -d white_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [natsdata:/data]

  identity:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: identity}}
    environment:
      <<: *env
      GRPC_ADDR: ":9001"
    ports: ["9001:9001"]

  integrations:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: integrations}}
    environment:
      <<: *env
      GRPC_ADDR: ":9002"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-change-me}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTORS: ${APIFY_ACTORS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
    ports: ["9002:9002"]

  analytics:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: analytics}}
    environment:
      <<: *env
      GRPC_ADDR: ":9003"
    ports: ["9003:9003"]

  publishing:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: publishing}}
    environment:
      <<: *env
      GRPC_ADDR: ":9004"
      UPLOAD_DIR: /uploads
    volumes: [uploads:/uploads]
    ports: ["9004:9004"]

  seosuite:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: seosuite}}
    environment:
      <<: *env
      GRPC_ADDR: ":9005"
    ports: ["9005:9005"]

  reports:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: reports}}
    environment:
      <<: *env
      GRPC_ADDR: ":9006"
    ports: ["9006:9006"]

  content:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: content}}
    environment:
      <<: *env
      GRPC_ADDR: ":9011"
      CONTENT_UPLOAD_DIR: /uploads/content
    volumes: [uploads:/uploads]
    ports: ["9011:9011"]

  finance:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: finance}}
    environment:
      <<: *env
      GRPC_ADDR: ":9007"
      FINANCE_UPLOAD_DIR: /uploads/finance
    volumes: [uploads:/uploads]
    ports: ["9007:9007"]

  hr:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: hr}}
    environment:
      <<: *env
      GRPC_ADDR: ":9008"
      HR_UPLOAD_DIR: /uploads/hr
    volumes: [uploads:/uploads]
    ports: ["9008:9008"]

  recruitment:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: recruitment}}
    environment:
      <<: *env
      GRPC_ADDR: ":9009"
      RECRUITMENT_UPLOAD_DIR: /uploads/recruitment
      RECRUITMENT_NOTIFY_USER_IDS: ${RECRUITMENT_NOTIFY_USER_IDS:-}
    volumes: [uploads:/uploads]
    ports: ["9009:9009"]

  sales:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: sales}}
    environment:
      <<: *env
      GRPC_ADDR: ":9010"
      SALES_UPLOAD_DIR: /uploads/sales
    volumes: [uploads:/uploads]
    ports: ["9010:9010"]

  performance:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: performance}}
    environment:
      <<: *env
      GRPC_ADDR: ":9012"
      PERFORMANCE_UPLOAD_DIR: /uploads/performance
    volumes: [uploads:/uploads]
    ports: ["9012:9012"]

  scheduler:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: scheduler}}
    command: ["worker"]

  gateway:
    <<: *service
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: gateway}}
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on: [identity, integrations, analytics, publishing, seosuite, reports, content, finance, hr, recruitment, sales, performance]

volumes:
  pgdata:
  natsdata:
  uploads:
