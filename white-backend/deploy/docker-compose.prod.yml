# Production stack for one Docker host: every service from the GHCR images CI
# builds, NATS, and Caddy terminating HTTPS in front of the gateway.
# Postgres stays external: it must be the same database the Next.js app uses.
# Run through deploy.sh, which reads .env next to this file.
name: mixist-backend

x-service: &service
  restart: unless-stopped
  env_file: .env
  environment: &env
    NATS_URL: nats://nats:4222
    LOG_FORMAT: json
    IDENTITY_ADDR: identity:9001
    INTEGRATIONS_ADDR: integrations:9002
    ANALYTICS_ADDR: analytics:9003
    PUBLISHING_ADDR: publishing:9004
    SEOSUITE_ADDR: seosuite:9005
    REPORTS_ADDR: reports:9006
    FINANCE_ADDR: finance:9007
    HR_ADDR: hr:9008
    RECRUITMENT_ADDR: recruitment:9009
    SALES_ADDR: sales:9010
    CONTENT_ADDR: content:9011
    PERFORMANCE_ADDR: performance:9012
  depends_on:
    nats:
      condition: service_started
    uploads-init:
      condition: service_completed_successfully
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    restart: unless-stopped
    volumes: [natsdata:/data]
    logging: *logging

  # The images run as distroless nonroot (uid 65532); a fresh volume is root-owned.
  uploads-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /uploads && chown -R 65532:65532 /uploads"]
    volumes: [uploads:/uploads]

  identity:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-identity:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9001"}

  integrations:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-integrations:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9002"}

  analytics:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-analytics:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9003"}

  publishing:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-publishing:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9004", UPLOAD_DIR: /uploads}
    volumes: [uploads:/uploads]

  seosuite:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-seosuite:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9005"}

  reports:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-reports:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9006"}

  finance:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-finance:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9007", FINANCE_UPLOAD_DIR: /uploads/finance}
    volumes: [uploads:/uploads]

  hr:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-hr:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9008", HR_UPLOAD_DIR: /uploads/hr}
    volumes: [uploads:/uploads]

  recruitment:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-recruitment:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9009", RECRUITMENT_UPLOAD_DIR: /uploads/recruitment}
    volumes: [uploads:/uploads]

  sales:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-sales:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9010", SALES_UPLOAD_DIR: /uploads/sales}
    volumes: [uploads:/uploads]

  content:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-content:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9011", CONTENT_UPLOAD_DIR: /uploads/content}
    volumes: [uploads:/uploads]

  performance:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-performance:${TAG:-latest}
    environment: {<<: *env, GRPC_ADDR: ":9012", PERFORMANCE_UPLOAD_DIR: /uploads/performance}
    volumes: [uploads:/uploads]

  scheduler:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-scheduler:${TAG:-latest}
    command: ["worker"]
    depends_on: [nats, identity, analytics, publishing, finance, hr, recruitment, sales, performance, content]

  gateway:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/syabanf/mixist}-gateway:${TAG:-latest}
    command: ["worker"]
    environment: {<<: *env, HTTP_ADDR: ":8080"}
    depends_on: [identity, integrations, analytics, publishing, seosuite, reports, content, finance, hr, recruitment, sales, performance]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?isi API_DOMAIN di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [gateway]
    logging: *logging

volumes:
  natsdata:
  uploads:
  caddydata:
  caddyconfig:
